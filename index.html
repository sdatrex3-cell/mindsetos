<!DOCTYPE html>
<html lang="si" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindsetOS - Ultimate Cloud Framework</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { darkbg: '#0f172a', darkcard: '#1e293b' } } }
        }
    </script>
    <!-- Chart.js for Analytics -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Noto+Sans+Sinhala:wght@400;600;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root { --font-main: 'Inter', 'Noto Sans Sinhala', sans-serif; }
        body { font-family: var(--font-main); scroll-behavior: smooth; }
        .animate-fade-in { animation: fadeIn 0.5s ease-out forwards; }
        .animate-slide-up { animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        .glass-nav { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(16px); }
        .dark .glass-nav { background: rgba(30, 41, 59, 0.85); border-right: 1px solid rgba(51, 65, 85, 0.8); }
        .card-hover:hover { transform: translateY(-5px); box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }
        
        .custom-scrollbar::-webkit-scrollbar { height: 8px; width: 8px; }
        
        .timer-circle { border-radius: 50%; }
        .perspective { perspective: 1000px; }
        .preserve-3d { transform-style: preserve-3d; transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1); }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
        
        .chart-container { position: relative; width: 100%; max-width: 800px; margin-left: auto; margin-right: auto; height: 300px; max-height: 400px; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-darkbg text-slate-900 dark:text-slate-100 overflow-x-hidden transition-colors duration-300">

    <div id="app-root"></div>
    <div id="toast-container" class="fixed top-24 right-6 z-50 flex flex-col space-y-2 pointer-events-none"></div>
    <div id="modal-container" class="fixed inset-0 z-[100] hidden items-center justify-center bg-slate-900/60 backdrop-blur-sm transition-opacity"></div>

    <!-- MAIN SCRIPT LOGIC (Modules & Global Functions Combined) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithCustomToken, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, getDoc, onSnapshot, getDocs, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // ==========================================
        // 1. DATA & STATE MANAGEMENT
        // ==========================================
        let auth, db, currentUid = null;
        let isAppLoading = true; // Prevents blank screens during load
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'mindsetos-app-v6';
        window.adminUsersData = [];

        let state = {
            activeTab: 'home',
            selectedArticleId: null,
            flippedCards: {},
            isNewUser: true,
            user: { name: '', email: '', password: '', joined: '', targetDate: '', theme: 'light', xp: 0, level: 1 },
            habits: [], history: [], reflections: {}, moods: {}, flashcards: [],
            stats: { totalFocusMinutes: 0 }, streak: { count: 0, lastDate: null },
            categories: {
                'Study': { name: 'අධ්‍යාපනය', color: 'bg-blue-100 text-blue-700 dark:bg-blue-900/50 dark:text-blue-300 border-blue-200 dark:border-blue-800' },
                'Health': { name: 'සෞඛ්‍යය', color: 'bg-green-100 text-green-700 dark:bg-green-900/50 dark:text-green-300 border-green-200 dark:border-green-800' },
                'Work': { name: 'ව්‍යාපාර', color: 'bg-orange-100 text-orange-700 dark:bg-orange-900/50 dark:text-orange-300 border-orange-200 dark:border-orange-800' },
                'Other': { name: 'වෙනත්', color: 'bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-300 border-slate-200 dark:border-slate-700' }
            }
        };

        const priorities = {
            'Q1': { name: 'හදිසි + වැදගත්', class: 'bg-red-50 text-red-600 dark:bg-red-900/20 dark:text-red-400' },
            'Q2': { name: 'වැදගත් පමණි', class: 'bg-indigo-50 text-indigo-600 dark:bg-indigo-900/20 dark:text-indigo-400' },
            'Q3': { name: 'හදිසි පමණි', class: 'bg-yellow-50 text-yellow-600 dark:bg-yellow-900/20 dark:text-yellow-400' },
            'Q4': { name: 'සාමාන්‍ය', class: 'bg-slate-50 text-slate-600 dark:bg-slate-800 dark:text-slate-400' }
        };

        const moodEmojis = { 'great': '🤩', 'good': '😊', 'neutral': '😐', 'bad': '😫' };
        let timerState = { mode: 'focus', timeLeft: 25 * 60, isRunning: false, interval: null };
        let progressChartInstance = null;

        const defaultArticles = [
            { id: "default-1", title: "මනස සන්සුන් කරගැනීමේ විද්‍යාව", author: "MindsetOS Team", category: "Health", icon: "🧘‍♂️", color: "text-blue-500", readTime: "විනාඩි 3", excerpt: "මානසික ආතතිය අවම කරගැනීමට හා අවධානය වැඩි කරගැනීමට...", intro: "ඔබේ මනස සන්සුන් කිරීම යනු හුදු විවේකයක් පමණක් නොව, මොළයේ ක්‍රියාකාරීත්වය වර්ධනය කරන විද්‍යාත්මක ක්‍රියාවලියකි.", sections: [{title: "හුස්ම ගැනීමේ වැදගත්කම", text: "ගැඹුරු හුස්ම ගැනීම් මගින් රුධිර පීඩනය පාලනය කර ස්නායු පද්ධතිය සන්සුන් කරයි."}], science: "Deep breathing activates the parasympathetic nervous system, lowering cortisol levels." },
            { id: "default-2", title: "සාර්ථකත්වයේ රහස: 1% Rule", author: "James Clear", category: "Study", icon: "📈", color: "text-green-500", readTime: "විනාඩි 5", excerpt: "දිනපතා 1% කින් දියුණු වීම හරහා වසරක් අවසානයේ 37 ගුණයක වර්ධනයක් ලබා ගන්නේ කෙසේද?", intro: "විශාල වෙනස්කම් එකවර කිරීමට යාමෙන් බොහෝ දෙනා අසාර්ථක වේ. නමුත් කුඩා පුරුදු දිගුකාලීනව පවත්වා ගැනීමෙන් ඉහළ ප්‍රතිඵල ලබාගත හැක.", sections: [{title: "Continuous Improvement", text: "ඔබ සෑම දිනකම 1% කින් දියුණු වුවහොත්, දින 365 කට පසු ඔබ සිටින්නේ විශාල ඉදිරි පිම්මකය."}], science: "Habit formation relies on neuroplasticity. Small, consistent actions create strong neural pathways." }
        ];
        let articles = [...defaultArticles];

        // ==========================================
        // 2. INITIALIZE FIREBASE (WITH LOCAL FALLBACK)
        // ==========================================
        try {
            render(); // Show Loading Screen Immediately
            
            const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;
            if(firebaseConfig && Object.keys(firebaseConfig).length > 0) {
                const app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);

                const initAuth = async () => {
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } else {
                        await signInAnonymously(auth);
                    }
                };
                initAuth();

                onAuthStateChanged(auth, async (user) => {
                    if (user) {
                        currentUid = user.uid;
                        await loadUserData(user.uid);
                        loadArticles();
                        if (isAdmin()) loadAllUsersForAdmin();
                    } else {
                        currentUid = null;
                        state.isNewUser = true;
                        isAppLoading = false;
                        render();
                    }
                });
            } else {
                initLocalMode();
            }
        } catch(e) {
            console.error("Firebase init failed, switching to local mode:", e);
            initLocalMode();
        }

        function initLocalMode() {
            db = null; auth = null; currentUid = 'local_user';
            const savedUser = localStorage.getItem("mindsetos_fallback_db");
            if (savedUser) { state = { ...state, ...JSON.parse(savedUser), isNewUser: false }; } 
            else { state.isNewUser = true; }
            
            const savedArts = localStorage.getItem("mindsetos_fallback_arts");
            if (savedArts) { articles = [...JSON.parse(savedArts), ...defaultArticles]; }
            
            checkNewDay(); applyTheme();
            isAppLoading = false; render();
        }

        async function loadUserData(uid) {
            try {
                const profileRef = doc(db, 'artifacts', appId, 'public', 'data', 'userProfiles', uid);
                const profileSnap = await getDoc(profileRef);

                if (profileSnap.exists()) {
                    state.user = { ...state.user, ...profileSnap.data() };
                    state.isNewUser = false;

                    const privateRef = doc(db, 'artifacts', appId, 'users', uid, 'userData', 'main');
                    const privateSnap = await getDoc(privateRef);
                    if (privateSnap.exists()) {
                        const pData = privateSnap.data();
                        state.habits = pData.habits || [];
                        state.history = pData.history || [];
                        state.reflections = pData.reflections || {};
                        state.moods = pData.moods || {};
                        state.flashcards = pData.flashcards || [];
                        state.stats = pData.stats || { totalFocusMinutes: 0 };
                        state.streak = pData.streak || { count: 0, lastDate: null };
                        if(pData.categories) state.categories = pData.categories;
                    }
                } else { state.isNewUser = true; }
            } catch (e) {
                console.error("Error loading user data:", e);
                state.isNewUser = true;
            } finally {
                checkNewDay(); applyTheme();
                isAppLoading = false; render();
            }
        }

        async function saveData() { 
            if (state.isNewUser) return;
            if (db && currentUid) {
                try {
                    const profileRef = doc(db, 'artifacts', appId, 'public', 'data', 'userProfiles', currentUid);
                    await setDoc(profileRef, {
                        name: state.user.name, email: state.user.email, joined: state.user.joined,
                        targetDate: state.user.targetDate, theme: state.user.theme, xp: state.user.xp,
                        level: state.user.level, totalFocusMinutes: state.stats.totalFocusMinutes, streakCount: state.streak.count
                    }, { merge: true });

                    const privateRef = doc(db, 'artifacts', appId, 'users', currentUid, 'userData', 'main');
                    await setDoc(privateRef, {
                        habits: state.habits, history: state.history, reflections: state.reflections,
                        moods: state.moods, flashcards: state.flashcards, stats: state.stats,
                        streak: state.streak, categories: state.categories
                    });
                } catch(e) { console.error("Error saving data:", e); }
            } else {
                localStorage.setItem("mindsetos_fallback_db", JSON.stringify(state));
            }
        }

        // ==========================================
        // 3. UI HELPERS & LOGIC
        // ==========================================
        function escapeHTML(str) { return str ? str.replace(/[&<>'"]/g, tag => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'}[tag])) : ''; }
        function isAdmin() { return state.user.email === 'admin@mindsetos.com' && state.user.password === 'sadew12125'; }

        function showToast(msg, type='info') {
            const container = document.getElementById('toast-container');
            const el = document.createElement('div');
            let bgClass = 'bg-indigo-600';
            if (type === 'success') bgClass = 'bg-emerald-500';
            else if (type === 'error') bgClass = 'bg-rose-500';
            el.className = `px-6 py-3 rounded-2xl font-bold shadow-lg animate-slide-up text-white ${bgClass}`;
            el.innerHTML = msg; container.appendChild(el);
            setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 300); }, 3000);
        }

        function showConfirmModal(message, onConfirm) {
            const container = document.getElementById('modal-container');
            container.innerHTML = `<div class="bg-white dark:bg-darkcard p-8 rounded-[2rem] shadow-2xl max-w-sm w-full mx-4 animate-slide-up border border-slate-200 dark:border-slate-700"><h3 class="text-xl font-black mb-4 text-slate-900 dark:text-white">තහවුරු කරන්න</h3><p class="text-slate-600 dark:text-slate-300 mb-8">${message}</p><div class="flex space-x-4"><button id="modal-cancel" class="flex-1 py-3 bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 font-bold rounded-xl hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors">අවලංගු කරන්න</button><button id="modal-confirm" class="flex-1 py-3 bg-rose-600 text-white font-bold rounded-xl hover:bg-rose-700 transition-colors">තහවුරුයි</button></div></div>`;
            container.classList.remove('hidden'); container.classList.add('flex');
            document.getElementById('modal-cancel').onclick = () => { container.classList.add('hidden'); container.classList.remove('flex'); };
            document.getElementById('modal-confirm').onclick = () => { container.classList.add('hidden'); container.classList.remove('flex'); onConfirm(); };
        }

        function showPromptModal(message, onConfirm) {
            const container = document.getElementById('modal-container');
            container.innerHTML = `<div class="bg-white dark:bg-darkcard p-8 rounded-[2rem] shadow-2xl max-w-sm w-full mx-4 animate-slide-up border border-slate-200 dark:border-slate-700"><h3 class="text-xl font-black mb-4 text-slate-900 dark:text-white">${message}</h3><input type="text" id="modal-input" class="w-full px-4 py-3 mb-8 bg-slate-50 dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 outline-none font-bold text-slate-800 dark:text-white"/><div class="flex space-x-4"><button id="modal-cancel" class="flex-1 py-3 bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 font-bold rounded-xl hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors">අවලංගු කරන්න</button><button id="modal-confirm" class="flex-1 py-3 bg-indigo-600 text-white font-bold rounded-xl hover:bg-indigo-700 transition-colors">එක් කරන්න</button></div></div>`;
            container.classList.remove('hidden'); container.classList.add('flex');
            document.getElementById('modal-cancel').onclick = () => { container.classList.add('hidden'); container.classList.remove('flex'); };
            document.getElementById('modal-confirm').onclick = () => {
                const val = document.getElementById('modal-input').value;
                container.classList.add('hidden'); container.classList.remove('flex');
                onConfirm(val);
            };
        }

        async function handleStart() { 
            const n = document.getElementById('init-name')?.value.trim(); 
            const e = document.getElementById('init-email')?.value.trim(); 
            const p = document.getElementById('init-password')?.value; 
            const d = document.getElementById('init-date')?.value;
            
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if(!n) return showToast("කරුණාකර ඔබගේ නම ඇතුළත් කරන්න.", "error");
            if(!e || !emailRegex.test(e)) return showToast("කරුණාකර නිවැරදි ඊමේල් ලිපිනයක් ඇතුළත් කරන්න.", "error");
            if(!p || p.length < 6) return showToast("කරුණාකර මුරපදයක් ඇතුළත් කරන්න.", "error");
            
            state.user.name = n; state.user.email = e; state.user.password = p; 
            state.user.targetDate = d; state.user.joined = new Date().toLocaleDateString('si-LK'); 
            state.isNewUser = false; 

            await saveData(); 
            if (isAdmin()) loadAllUsersForAdmin();
            render(); 
            showToast("සාර්ථකව පද්ධතියට එක්විය!", "success");
        }

        function checkNewDay() {
            if (state.isNewUser) return;
            const today = new Date().toLocaleDateString('si-LK');
            if (!state.streak.lastDate) {
                state.streak.lastDate = today; updateHistory();
            } else if (state.streak.lastDate !== today) {
                const yest = new Date(); yest.setDate(yest.getDate() - 1);
                if (state.streak.lastDate !== yest.toLocaleDateString('si-LK')) state.streak.count = 0; 
                state.habits = state.habits.map(h => ({ ...h, completed: false }));
                state.streak.lastDate = today; updateHistory(); saveData();
            }
        }

        // ==========================================
        // 4. ADMIN CAPABILITIES & CLOUD LOGIC
        // ==========================================
        function loadAllUsersForAdmin() {
            if (!isAdmin() || !currentUid || !db) return;
            try {
                const usersRef = collection(db, 'artifacts', appId, 'public', 'data', 'userProfiles');
                onSnapshot(usersRef, (snapshot) => {
                    window.adminUsersData = [];
                    snapshot.forEach(doc => { window.adminUsersData.push({ id: doc.id, ...doc.data() }); });
                    window.adminUsersData.sort((a,b) => (b.xp || 0) - (a.xp || 0));
                    if(state.activeTab === 'settings') render();
                }, (error) => console.error("Error fetching users:", error));
            } catch(e) { console.error("Admin user sync error", e); }
        }

        function loadArticles() {
            if (!currentUid || !db) return;
            try {
                const artsRef = collection(db, 'artifacts', appId, 'public', 'data', 'articles');
                onSnapshot(artsRef, (snapshot) => {
                    let loadedArts = [];
                    snapshot.forEach(doc => loadedArts.push(doc.data()));
                    loadedArts.sort((a,b) => (b.timestamp || 0) - (a.timestamp || 0));
                    articles = [...loadedArts, ...defaultArticles];
                    if (state.activeTab === 'library' || state.selectedArticleId || state.activeTab === 'settings') render();
                }, (error) => console.error("Error loading articles", error));
            } catch(e) { console.error("Article sync error", e); }
        }

        async function publishAdminArticle() {
            const titleElement = document.getElementById('admin-art-title');
            if(!titleElement) return;
            
            const title = titleElement.value;
            const author = document.getElementById('admin-art-author')?.value || 'MindsetOS Admin';
            const readTime = document.getElementById('admin-art-time')?.value || 'විනාඩි 5';
            const cat = document.getElementById('admin-art-cat')?.value || 'General';
            const intro = document.getElementById('admin-art-intro')?.value || '';
            const text = document.getElementById('admin-art-text')?.value || '';

                showToast(`🎉 Level Up! ඔබ දැන් Level ${state.user.level} යි.`, 'success');

        function applyTheme() { if (state.user.theme === 'dark') document.documentElement.classList.add('dark'); else document.documentElement.classList.remove('dark'); }

            if (text) { state.habits.unshift({ id: Date.now(), text: escapeHTML(text), category: cat, priority: pri, completed: false }); updateHistory(); render(); }
        }
        function toggleHabit(id) {
            let newlyCompleted = false;
            state.habits = state.habits.map(h => { if(h.id === id) { if(!h.completed) newlyCompleted = true; return { ...h, completed: !h.completed }; } return h; });
            if(newlyCompleted) { updateStreak(); addXP(10); }
            updateHistory(); render();
        }
        function deleteHabit(id) { state.habits = state.habits.filter(h => h.id !== id); updateHistory(); render(); }
        
        function updateStreak() {
            const today = new Date().toLocaleDateString('si-LK');
            if (state.streak.lastDate !== today) {
                const yest = new Date(); yest.setDate(yest.getDate() - 1);
                if (state.streak.lastDate === yest.toLocaleDateString('si-LK')) state.streak.count++; else state.streak.count = 1;
                state.streak.lastDate = today;
            }
        }
        
        function updateHistory() {
            const today = new Date().toLocaleDateString('si-LK');
            const score = state.habits.length ? Math.round((state.habits.filter(h => h.completed).length / state.habits.length) * 100) : 0;
            state.history = [...state.history.filter(d => d.date !== today), { date: today, score }].slice(-14); saveData();
        }
        
        function addCustomCategory() {
            showPromptModal("නව කාණ්ඩයේ නම ඇතුළත් කරන්න:", (catName) => {

                    saveData(); render(); showToast("නව කාණ්ඩය සාර්ථකව එක් කරන ලදී.", "success");
                }
            });
        }
        function updateTargetDate(val) { state.user.targetDate = val; saveData(); render(); showToast("විභාග/ඉලක්ක දිනය යාවත්කාලීන විය.", "success"); }
        function setMood(mood) { state.moods[new Date().toLocaleDateString('si-LK')] = mood; saveData(); render(); }
        function saveJournal() { state.reflections[new Date().toLocaleDateString('si-LK')] = escapeHTML(document.getElementById('journal-text')?.value); saveData(); showToast('දවසේ සටහන සුරැකිණි.', 'success'); }
        
        function addFlashcard() {

        }

        function flipCardDOM(id, element) { state.flippedCards[id] = !state.flippedCards[id]; element.querySelector('.preserve-3d').classList.toggle('rotate-y-180'); }

        let audioCtxObj = null; let noiseSourceNode = null;
        function toggleFocusSound(type) {
            if (audioCtxObj) { audioCtxObj.close(); audioCtxObj = null; noiseSourceNode = null; return; }
            try {
                audioCtxObj = new (window.AudioContext || window.webkitAudioContext)();
                const buffer = audioCtxObj.createBuffer(1, audioCtxObj.sampleRate * 2, audioCtxObj.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
                noiseSourceNode = audioCtxObj.createBufferSource(); noiseSourceNode.buffer = buffer; noiseSourceNode.loop = true;
                const filter = audioCtxObj.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.value = type === 'rain' ? 400 : (type === 'forest' ? 800 : 2500);
                noiseSourceNode.connect(filter); filter.connect(audioCtxObj.destination); noiseSourceNode.start();
                showToast(type + ' sound on', 'success');
            } catch(e) { console.log(e); showToast("ශ්‍රව්‍ය පහසුකම භාවිතා කිරීමට Play බොත්තම ඔබන්න.", "error"); }
        }
        
        function toggleTimer() {
            if (timerState.isRunning) { clearInterval(timerState.interval); timerState.isRunning = false; } 
            else {
                timerState.isRunning = true;
                timerState.interval = setInterval(() => {
                    if (timerState.timeLeft > 0) { timerState.timeLeft--; updateTimerUI(); } 
                    else {
                        clearInterval(timerState.interval); timerState.isRunning = false;
                        if(audioCtxObj) { audioCtxObj.close(); audioCtxObj=null; }
                        if(timerState.mode === 'focus') { addXP(25); state.stats.totalFocusMinutes += 25; saveData(); showToast("Focus Time එක අවසන්. 25 XP ලබාගත්තා.", "success"); switchTimerMode('break'); }
                        else { showToast("විවේකය අවසන්! නැවත වැඩ පටන් ගනිමු.", "info"); switchTimerMode('focus'); }
                    }
                }, 1000);
            }
            render();
        }
        function switchTimerMode(mode) { clearInterval(timerState.interval); timerState.isRunning = false; timerState.mode = mode; timerState.timeLeft = mode === 'focus' ? 25 * 60 : 5 * 60; render(); }
        function updateTimerUI() {
            const el = document.getElementById('timer-display');
            if(el) el.innerText = `${Math.floor(timerState.timeLeft / 60).toString().padStart(2, '0')}:${(timerState.timeLeft % 60).toString().padStart(2, '0')}`;
            const circle = document.getElementById('timer-circle-bg');
            if(circle) circle.style.background = `conic-gradient(${timerState.mode === 'focus' ? (state.user.theme === 'dark' ? '#6366f1' : '#4f46e5') : '#10b981'} ${(( (timerState.mode === 'focus' ? 25*60 : 5*60) - timerState.timeLeft) / (timerState.mode === 'focus' ? 25*60 : 5*60)) * 100}%, transparent 0deg)`;
        }

        function exportData() {
            const dataStr = JSON.stringify(state);

            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = `MindsetOS_Backup_${state.user.email}_${new Date().toISOString().split('T')[0]}.json`;

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    if (data && data.user) {
                        state = { ...state, ...data };
                        await saveData(); 
                        showToast("දත්ත සාර්ථකව Restore කරන ලදී! Cloud Database එකද යාවත්කාලීන විය.", "success");
                        render();

        function initProgressChart() {
            const ctx = document.getElementById('progressChart');

            if(progressChartInstance) progressChartInstance.destroy();

            const isDark = state.user.theme === 'dark';
            const textColor = isDark ? '#cbd5e1' : '#475569';
            const gridColor = isDark ? 'rgba(255,255,255,0.05)' : 'rgba(0,0,0,0.05)';

            const labels = state.history.length ? state.history.map(d => d.date) : ['අද'];
            const data = state.history.length ? state.history.map(d => d.score) : [0];

            progressChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'දෛනික ප්‍රගතිය (%)', data: data, borderColor: '#6366f1', backgroundColor: 'rgba(99, 102, 241, 0.2)', borderWidth: 3,
                        pointBackgroundColor: '#4f46e5', pointBorderColor: '#ffffff', pointRadius: 5, pointHoverRadius: 8, tension: 0.4, fill: true
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { display: false }, tooltip: { backgroundColor: isDark ? '#1e293b' : '#ffffff', titleColor: isDark ? '#ffffff' : '#0f172a', bodyColor: isDark ? '#cbd5e1' : '#475569', borderColor: isDark ? '#334155' : '#e2e8f0', borderWidth: 1, padding: 12, boxPadding: 4, callbacks: { label: function(context) { return ` ප්‍රගතිය: ${context.raw}%`; } } } },
                    scales: { y: { beginAtZero: true, max: 100, grid: { color: gridColor }, ticks: { color: textColor, callback: function(value) { return value + "%"; } } }, x: { grid: { display: false }, ticks: { color: textColor, maxRotation: 45, minRotation: 45 } } }
                }
            });
        }

        function getDaysRemaining() {
            if(!state.user.targetDate) return null;

                        <input type="password" id="init-password" placeholder="මුරපදය (Password)" class="w-full p-4 bg-slate-900/60 rounded-2xl outline-none font-bold text-base border border-slate-700 focus:border-indigo-500 transition-colors"/>
                        
                        <label class="text-xs font-bold text-indigo-400 uppercase tracking-widest pl-2 mt-4 block">මීළඟ ඉලක්ක දිනය (විකල්ප)</label>
                        <input type="date" id="init-date" class="w-full p-4 bg-slate-900/60 rounded-2xl outline-none font-bold text-slate-400 [color-scheme:dark] border border-slate-700 focus:border-indigo-500 transition-colors"/>

                </div>

        function renderSidebar() {

        }

            const score = state.habits.length ? Math.round((state.habits.filter(h => h.completed).length / state.habits.length) * 100) : 0;

            if (hour < 12) greeting = "සුබ උදෑසනක්"; else if (hour < 18) greeting = "සුබ දහවලක්"; else greeting = "සුබ රාත්‍රියක්";

            const todayQuote = quotes[new Date().getDay() % quotes.length];
            const pendingTasks = state.habits.filter(h => !h.completed).slice(0, 3);
            const dateString = new Date().toLocaleDateString('si-LK', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

            return `<div class="space-y-8 animate-fade-in pb-10"><header class="flex flex-col md:flex-row md:items-end justify-between space-y-4 md:space-y-0"><div><p class="text-indigo-600 dark:text-indigo-400 font-bold tracking-widest uppercase text-sm mb-2">${dateString}</p><h2 class="text-4xl md:text-5xl font-black tracking-tight">${greeting}, ${escapeHTML(state.user.name)}! ✨</h2></div>${daysLeft !== null ? `<div class="bg-white dark:bg-darkcard px-6 py-4 rounded-3xl shadow-sm border border-slate-100 dark:border-slate-800 flex items-center space-x-4"><div class="p-3 bg-red-50 dark:bg-red-900/20 rounded-2xl text-2xl text-red-500">🔥</div><div><p class="text-xs font-bold text-slate-400 uppercase tracking-widest">ඉලක්කයට තවත්</p><p class="text-2xl font-black text-slate-800 dark:text-white">${daysLeft} <span class="text-sm text-slate-500">දිනයි</span></p></div></div>` : ''}</header><div class="grid grid-cols-2 md:grid-cols-4 gap-4"><button onclick="switchTab('timer')" class="bg-white dark:bg-darkcard p-4 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-800 flex items-center justify-center space-x-3 hover:bg-indigo-50 dark:hover:bg-indigo-900/20 transition-colors group"><span class="text-xl group-hover:scale-110 transition-transform">▶️</span><span class="font-bold text-sm">Deep Work</span></button><button onclick="switchTab('planner')" class="bg-white dark:bg-darkcard p-4 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-800 flex items-center justify-center space-x-3 hover:bg-indigo-50 dark:hover:bg-indigo-900/20 transition-colors group"><span class="text-xl group-hover:scale-110 transition-transform">➕</span><span class="font-bold text-sm">නව කාර්යයක්</span></button><button onclick="switchTab('flashcards')" class="bg-white dark:bg-darkcard p-4 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-800 flex items-center justify-center space-x-3 hover:bg-indigo-50 dark:hover:bg-indigo-900/20 transition-colors group"><span class="text-xl group-hover:scale-110 transition-transform">🗂️</span><span class="font-bold text-sm">Flashcards</span></button><button onclick="shareToWhatsApp()" class="bg-[#25D366]/10 dark:bg-[#25D366]/20 p-4 rounded-2xl shadow-sm flex items-center justify-center space-x-3 hover:bg-[#25D366]/30 transition-colors group"><span class="text-xl group-hover:scale-110 transition-transform text-[#25D366]">🔗</span><span class="font-bold text-sm text-[#25D366]">Share Progress</span></button></div><div class="grid grid-cols-1 lg:grid-cols-3 gap-8"><div class="space-y-8"><div class="bg-white dark:bg-darkcard rounded-[3rem] p-10 border border-slate-100 dark:border-slate-800 shadow-sm relative overflow-hidden"><div class="absolute top-0 right-0 p-8 opacity-5 dark:opacity-10 text-9xl">🎯</div><h4 class="font-black text-slate-400 uppercase text-xs tracking-widest mb-6 relative z-10">අද දෛනික ප්‍රගතිය</h4><div class="flex items-baseline relative z-10"><span class="text-7xl font-black">${score}</span><span class="text-3xl font-black text-slate-300">%</span></div><div class="w-full bg-slate-100 dark:bg-slate-800 h-6 rounded-full overflow-hidden p-1 mt-8 relative z-10"><div class="bg-gradient-to-r from-indigo-500 to-purple-500 h-full rounded-full transition-all duration-1000 shadow-[0_0_15px_rgba(99,102,241,0.5)]" style="width:${score}%"></div></div></div><div class="bg-gradient-to-br from-indigo-600 to-purple-700 rounded-[2.5rem] p-8 text-white shadow-lg relative overflow-hidden"><span class="absolute right-[-10%] bottom-[-10%] text-9xl text-white/10 rotate-12">"</span><p class="text-lg font-medium italic relative z-10">"${todayQuote}"</p><p class="text-xs font-bold text-indigo-200 mt-4 uppercase tracking-widest relative z-10">— Daily Insight</p></div></div><div class="lg:col-span-2 space-y-8"><div class="bg-white dark:bg-darkcard rounded-[3rem] p-8 md:p-10 border border-slate-100 dark:border-slate-800 shadow-sm"><div class="flex justify-between items-center mb-6"><h4 class="font-black text-lg flex items-center space-x-3"><div class="p-2 bg-orange-100 dark:bg-orange-900/30 rounded-lg text-lg">🕒</div><span>මීළඟට කළ යුතු (Up Next)</span></h4><button onclick="switchTab('planner')" class="text-sm font-bold text-indigo-600 dark:text-indigo-400 hover:underline">සියල්ල බලන්න</button></div><div class="space-y-3">${pendingTasks.length === 0 ? `<div class="text-center py-8 text-slate-400 bg-slate-50 dark:bg-slate-800/50 rounded-2xl border border-dashed border-slate-200 dark:border-slate-700"><p class="font-bold">නියමයි! අදට නියමිත සියලුම වැඩ අවසන්.</p></div>` : pendingTasks.map(h => { const pri = priorities[h.priority] || priorities['Q4']; return `<div class="flex items-center justify-between p-4 bg-slate-50 dark:bg-slate-800/50 rounded-2xl hover:bg-slate-100 dark:hover:bg-slate-700/50 transition-colors group cursor-pointer" onclick="toggleHabit(${h.id})"><div class="flex items-center space-x-4"><div class="w-8 h-8 rounded-lg border-2 flex items-center justify-center border-slate-300 dark:border-slate-600 group-hover:border-indigo-500 transition-colors"></div><div><p class="font-bold text-slate-800 dark:text-white truncate max-w-[200px] md:max-w-md">${h.text}</p><span class="text-[9px] font-black uppercase ${pri.class} px-2 py-0.5 rounded border border-transparent">${pri.name}</span></div></div><button onclick="event.stopPropagation(); switchTab('timer')" class="text-slate-400 hover:text-indigo-600 p-2 text-xl" title="Start Timer">▶️</button></div>` }).join('')}</div></div><div class="bg-slate-900 dark:bg-slate-800 rounded-[3rem] p-8 md:p-10 text-white cursor-pointer relative overflow-hidden shadow-xl hover:shadow-2xl transition-shadow group" onclick="switchTab('library')"><div class="absolute inset-0 bg-gradient-to-r from-blue-600/20 to-purple-600/20"></div><div class="relative z-10 flex flex-col md:flex-row md:items-center justify-between"><div class="mb-6 md:mb-0 md:mr-6"><span class="bg-blue-500/20 text-blue-300 px-3 py-1 rounded-full text-[10px] font-black uppercase mb-4 inline-block border border-blue-500/30">නව දැනුම</span><h3 class="text-2xl md:text-3xl font-black mb-2 group-hover:text-blue-300 transition-colors">ඔබේ මනස තියුණු කරන්න.</h3><p class="text-slate-400 text-sm md:text-base">Cloud පුස්තකාලය වෙත ගොස් අලුත්ම මනෝවිද්‍යාත්මක ලිපි කියවන්න.</p></div><div class="shrink-0 bg-white/10 p-4 rounded-2xl backdrop-blur-md border border-white/20 group-hover:bg-white/20 transition-colors text-3xl">📖</div></div><span class="absolute right-[5%] bottom-[5%] text-6xl opacity-10 group-hover:rotate-12 transition-transform duration-700">✨</span></div></div></div></div>`;
        }

        function renderPlanner() {
            const today = new Date().toLocaleDateString('si-LK');
            return `<div class="max-w-4xl mx-auto space-y-10 pb-10"><header class="text-center"><h2 class="text-4xl font-black tracking-tight">දෛනික සැලසුම්කරු (Matrix)</h2><p class="mt-4 text-slate-500">අද දිනය සඳහා ඔබගේ අරමුණු පෙළගස්වා කළමනාකරණය කරන්න.</p></header><div class="bg-white dark:bg-darkcard p-4 rounded-[2rem] shadow-sm border border-slate-100 dark:border-slate-800 flex flex-col md:flex-row space-y-4 md:space-y-0 md:space-x-3"><input type="text" id="habit-text" onkeydown="if(event.key==='Enter')addHabit()" placeholder="වැඩක් ඇතුළත් කරන්න..." class="flex-1 px-4 py-3 bg-slate-50 dark:bg-slate-800/50 rounded-xl outline-none font-bold text-slate-800 dark:text-white"/><select id="habit-priority" class="px-4 py-3 bg-slate-50 dark:bg-slate-800/50 rounded-xl font-bold text-slate-600 dark:text-slate-300">${Object.keys(priorities).map(k => `<option value="${k}">${priorities[k].name}</option>`).join('')}</select><select id="habit-cat" class="px-4 py-3 bg-slate-50 dark:bg-slate-800/50 rounded-xl font-bold text-slate-600 dark:text-slate-300">${Object.keys(state.categories).map(k => `<option value="${k}">${state.categories[k].name}</option>`).join('')}</select><button onclick="addHabit()" class="bg-indigo-600 text-white px-6 py-3 rounded-xl font-black hover:bg-indigo-700">එක් කරන්න</button></div><div class="space-y-4">${state.habits.map(h => { const pri = priorities[h.priority] || priorities['Q4']; const cat = state.categories[h.category] || state.categories['Other']; return `<div class="flex items-center justify-between p-5 bg-white dark:bg-darkcard border rounded-[1.5rem] card-hover ${h.completed ? 'opacity-60 bg-slate-50 dark:bg-slate-900' : 'border-slate-200 dark:border-slate-700'}"><div class="flex items-center space-x-4"><button onclick="toggleHabit(${h.id})" class="w-12 h-12 rounded-xl border-2 flex items-center justify-center text-xl font-black ${h.completed?'bg-indigo-600 border-indigo-600 text-white':'bg-slate-50 dark:bg-slate-800 dark:border-slate-600'}">${h.completed?'✓':''}</button><div><div class="flex space-x-2 mb-1"><span class="px-2 py-0.5 text-[9px] font-black uppercase rounded border ${pri.class}">${pri.name}</span><span class="px-2 py-0.5 text-[9px] font-black uppercase rounded border ${cat.color}">${cat.name}</span></div><p class="font-black text-xl break-all ${h.completed?'line-through text-slate-400':'text-slate-800 dark:text-white'}">${h.text}</p></div></div><button onclick="deleteHabit(${h.id})" class="p-3 text-slate-400 hover:text-red-500 text-xl">🗑️</button></div>`; }).join('')}</div><div class="bg-white dark:bg-darkcard p-8 rounded-[2.5rem] border border-slate-100 dark:border-slate-800 space-y-6"><div><h3 class="text-2xl font-black mb-2">දවසේ සටහන (Journal & Mood)</h3></div><div class="flex space-x-4 mb-4">${Object.keys(moodEmojis).map(m => `<button onclick="setMood('${m}')" class="text-4xl hover:scale-125 transition-transform ${state.moods[today]===m?'scale-125 bg-slate-100 dark:bg-slate-800 rounded-full':''}">${moodEmojis[m]}</button>`).join('')}</div><textarea id="journal-text" placeholder="අද දවස ගැන ලියන්න..." class="w-full bg-slate-50 dark:bg-slate-800 p-6 rounded-2xl outline-none font-medium text-lg h-32 resize-none border-2 border-transparent focus:border-indigo-400">${state.reflections[today]||''}</textarea><button onclick="saveJournal()" class="w-full py-4 bg-indigo-600 text-white font-black rounded-xl hover:bg-indigo-700">සටහන සුරකින්න</button></div></div>`;
        }

        function renderTimer() {
            return `<div class="max-w-xl mx-auto space-y-10 text-center pb-20"><header><h2 class="text-4xl font-black">Deep Work Timer</h2><p class="mt-4 text-slate-500">බාධාවකින් තොරව අවධානය යොමු කිරීමට උපකාරී වන කාල ගණනය.</p></header><div class="bg-white dark:bg-darkcard p-12 rounded-[3rem] border border-slate-100 dark:border-slate-800 relative"><div class="flex justify-center space-x-2 mb-8">${['rain','forest','noise'].map(t=>`<button onclick="toggleFocusSound('${t}')" class="px-4 py-2 rounded-lg text-xs font-bold border bg-slate-50 dark:bg-slate-800 focus:bg-indigo-100">${t.toUpperCase()}</button>`).join('')}</div><div class="flex justify-center space-x-4 mb-8"><button onclick="switchTimerMode('focus')" class="px-6 py-2 rounded-xl font-bold text-sm ${timerState.mode==='focus'?'bg-indigo-600 text-white':'bg-slate-100 dark:bg-slate-800 text-slate-500'}">Focus (25m)</button><button onclick="switchTimerMode('break')" class="px-6 py-2 rounded-xl font-bold text-sm ${timerState.mode==='break'?'bg-green-500 text-white':'bg-slate-100 dark:bg-slate-800 text-slate-500'}">Break (5m)</button></div><div class="relative w-64 h-64 mx-auto mb-10 flex items-center justify-center"><div class="absolute inset-0 bg-slate-200 dark:bg-slate-700 rounded-full"></div><div id="timer-circle-bg" class="absolute inset-0 timer-circle transition-all duration-1000"></div><div class="absolute inset-3 bg-white dark:bg-darkcard rounded-full flex items-center justify-center"><span id="timer-display" class="text-6xl font-black">25:00</span></div></div><button onclick="toggleTimer()" class="w-20 h-20 rounded-full mx-auto flex items-center justify-center text-white text-3xl ${timerState.isRunning?'bg-rose-500':'bg-slate-900 dark:bg-slate-700'}"><span>${timerState.isRunning?'⏸️':'▶️'}</span></button></div></div>`;
        }

        function renderFlashcards() {
            return `<div class="max-w-4xl mx-auto space-y-10 pb-20"><header class="text-center"><h2 class="text-4xl font-black">Active Recall Flashcards</h2><p class="mt-4 text-slate-500">කෙටි කාලීන මතකය දිගු කාලීනව තහවුරු කරගැනීමට.</p></header><div class="bg-white dark:bg-darkcard p-6 rounded-[2rem] border border-slate-100 dark:border-slate-800 flex flex-col md:flex-row gap-4"><input type="text" id="fc-q" placeholder="ප්‍රශ්නය..." class="flex-1 px-4 py-3 bg-slate-50 dark:bg-slate-800 rounded-xl outline-none font-bold"/><input type="text" id="fc-a" placeholder="පිළිතුර..." class="flex-1 px-4 py-3 bg-slate-50 dark:bg-slate-800 rounded-xl outline-none font-bold"/><button onclick="addFlashcard()" class="bg-indigo-600 text-white px-6 py-3 rounded-xl font-black">එක් කරන්න</button></div><div class="grid grid-cols-1 md:grid-cols-2 gap-6 perspective">${state.flashcards.length === 0 ? `<div class="col-span-full text-center py-10 text-slate-400">Card එකක් සාදා ඉගෙනීම අරඹන්න.</div>` : state.flashcards.map(f => `<div class="relative h-48 w-full group cursor-pointer" onclick="flipCardDOM(${f.id}, this)"><div class="absolute inset-0 w-full h-full preserve-3d ${state.flippedCards[f.id] ? 'rotate-y-180' : ''}"><div class="absolute inset-0 backface-hidden bg-white dark:bg-darkcard border border-slate-200 dark:border-slate-700 rounded-[2rem] p-6 flex flex-col justify-center items-center shadow-sm"><span class="text-xs font-bold text-indigo-500 mb-2">ප්‍රශ්නය</span><h3 class="text-xl font-black text-center break-words w-full">${f.q}</h3><button onclick="event.stopPropagation(); deleteFlashcard(${f.id})" class="absolute top-4 right-4 text-slate-300 hover:text-red-500 text-lg">🗑️</button></div><div class="absolute inset-0 backface-hidden rotate-y-180 bg-indigo-600 text-white rounded-[2rem] p-6 flex flex-col justify-center items-center shadow-md"><span class="text-xs font-bold text-indigo-200 mb-2">පිළිතුර</span><h3 class="text-2xl font-black text-center break-words w-full">${f.a}</h3></div></div></div>`).join('')}</div></div>`;
        }

        function renderLibrary() {
            return `<div class="space-y-10 pb-20"><header><h2 class="text-4xl font-black mb-2">පර්යේෂණ පුස්තකාලය</h2><p class="text-slate-500 font-bold">ඔබේ මනස දියුණු කරන නවතම ලිපි එකතුව</p></header><div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">${articles.map(a => `<div onclick="viewArticle('${a.id}')" class="bg-white dark:bg-darkcard rounded-[2.5rem] p-8 border border-slate-100 dark:border-slate-800 shadow-sm cursor-pointer card-hover"><div><div class="w-16 h-16 bg-slate-50 dark:bg-slate-800 rounded-2xl flex items-center justify-center mb-6 text-3xl ${a.color}">${a.icon}</div><h3 class="text-2xl font-black mb-3">${a.title}</h3><p class="text-slate-500 text-sm mb-6 line-clamp-3">${a.excerpt}</p></div><button class="w-full py-3 bg-slate-50 dark:bg-slate-800 font-bold rounded-xl text-slate-700 dark:text-slate-300">කියවන්න (+5 XP)</button></div>`).join('')}</div></div>`;
        }

        function renderArticleView() {
            const a = articles.find(x => x.id === state.selectedArticleId);
            if(!a) return '';
            return `<div class="max-w-3xl mx-auto space-y-10 pb-20 print-content"><div class="flex justify-between items-center print-hidden"><button onclick="switchTab('library')" class="bg-white dark:bg-darkcard px-4 py-2 rounded-xl border border-slate-200 dark:border-slate-700 flex items-center space-x-2 font-bold"><span class="text-xl">⬅️</span><span>ආපසු</span></button><button onclick="window.print()" class="bg-slate-900 text-white px-4 py-2 rounded-xl flex items-center space-x-2 font-bold shadow-lg"><span class="text-xl">🖨️</span><span>PDF / Print</span></button></div><h2 class="text-4xl font-black print-text-black">${a.title}</h2><div class="flex space-x-4 text-sm text-slate-500 font-bold"><span>කර්තෘ: ${a.author}</span><span>• කාලය: ${a.readTime}</span></div><p class="text-xl text-slate-600 dark:text-slate-300 italic border-l-4 border-indigo-400 pl-6 print-text-black print-border-light">${a.intro}</p>${a.sections.map(s=>`<div class="space-y-2"><h3 class="text-xl font-black text-indigo-600">${s.title}</h3><p class="text-lg text-slate-700 dark:text-slate-300 print-text-black whitespace-pre-wrap">${s.text}</p></div>`).join('')}<div class="bg-slate-900 rounded-[2rem] p-8 text-white shadow-xl mt-8 print:bg-white print:text-black print:border-2 print-border-light print:shadow-none"><div class="flex items-center space-x-3 mb-4"><span class="text-indigo-400 text-2xl">🧬</span><h4 class="text-xl font-black uppercase">විද්‍යාත්මක පදනම</h4></div><p class="text-slate-300 text-lg leading-relaxed print-text-black">${a.science}</p></div></div>`;
        }

        function renderStats() {
            const moodCounts = Object.values(state.moods).reduce((acc, emoji) => { acc[emoji] = (acc[emoji] || 0) + 1; return acc; }, {});
            return `<div class="space-y-10 pb-20"><header class="text-center"><h2 class="text-4xl font-black">Detailed Analytics</h2><p class="mt-4 text-slate-500">ඔබගේ වර්ධනය පිළිබඳ දත්ත හා සංඛ්‍යානමය විශ්ලේෂණ</p></header><div class="grid grid-cols-1 md:grid-cols-3 gap-6"><div class="bg-indigo-600 text-white p-8 rounded-[2rem] text-center shadow-lg"><h4 class="text-5xl font-black mb-2">${state.user.level}</h4><p class="font-bold uppercase tracking-widest text-xs opacity-80">දැනට පවතින Level එක</p><p class="mt-4 text-sm font-bold bg-white/20 rounded-full py-1">${state.user.xp} XP / ${state.user.level*100} XP</p></div><div class="bg-white dark:bg-darkcard p-8 rounded-[2rem] border border-slate-100 dark:border-slate-800 text-center"><h4 class="text-5xl font-black text-slate-900 dark:text-white mb-2">${Math.round(state.stats.totalFocusMinutes/60)}<span class="text-2xl text-slate-400">h</span></h4><p class="font-bold uppercase tracking-widest text-xs text-slate-500">Total Focus Time</p></div><div class="bg-white dark:bg-darkcard p-8 rounded-[2rem] border border-slate-100 dark:border-slate-800 text-center"><div class="flex justify-center space-x-2 text-3xl mb-4">${Object.keys(moodCounts).length ? Object.keys(moodCounts).slice(0,3).map(m=>`<span>${moodEmojis[m]}</span>`).join('') : '➖'}</div><p class="font-bold uppercase tracking-widest text-xs text-slate-500">ප්‍රධාන මානසික මට්ටම්</p></div></div><div class="bg-white dark:bg-darkcard p-10 rounded-[3rem] border border-slate-100 dark:border-slate-800 shadow-sm"><h4 class="font-black mb-6 text-center text-slate-600 dark:text-slate-300">පසුගිය දින 14 ක ප්‍රස්ථාරය (Daily Progress Chart)</h4><div class="chart-container"><canvas id="progressChart"></canvas></div></div></div>`;
        }

        function renderSettings() {
            const adminMode = isAdmin();
            
            const publishedArticles = articles.filter(a => a.id.startsWith('custom-'));
            const renderedArticleList = publishedArticles.length === 0 ? 
                '<p class="text-slate-400 text-sm text-center py-4">දැනට ඔබ විසින් පළකළ ලිපි කිසිවක් නැත.</p>' : 
                publishedArticles.map(a => `
                    <div class="flex justify-between items-center p-3 bg-slate-800 rounded-lg border border-slate-700">
                        <span class="text-sm font-bold text-slate-200 truncate pr-4">${a.title}</span>
                        <button onclick="deleteAdminArticle('${a.id}')" class="text-rose-500 hover:text-rose-400 p-2 bg-slate-900 rounded-md transition-colors" title="Delete Article"><span class="text-lg">🗑️</span></button>
                    </div>
                `).join('');

            return `
            <div class="max-w-2xl mx-auto space-y-10 pb-20">
                <header><h2 class="text-4xl font-black text-center">සැකසුම්</h2></header>
                <div class="bg-white dark:bg-darkcard p-8 md:p-10 rounded-[3rem] border border-slate-100 dark:border-slate-800 space-y-6 shadow-sm">
                    
                    ${adminMode ? `
                    <!-- ADMIN PANEL START -->
                    <div class="p-6 md:p-8 bg-slate-900 rounded-3xl border border-slate-800 mb-6 text-white shadow-xl animate-fade-in">
                        <div class="flex items-center justify-between mb-8">
                            <div class="flex items-center space-x-3">
                                <span class="text-2xl bg-indigo-500/20 p-3 rounded-xl border border-indigo-500/30">🖥️</span>
                                <div>
                                    <h3 class="text-2xl font-black tracking-tight">Admin Panel</h3>
                                    <p class="text-xs font-bold uppercase tracking-widest text-indigo-400 mt-1">Cloud Dashboard</p>
                                </div>
                            </div>
                        </div>

                        <!-- 1. MANAGE USERS TABLE -->
                        <div class="mb-10">
                            <h4 class="font-bold text-blue-400 mb-4 flex items-center gap-2 text-lg"><span>👥</span> ලියාපදිංචි පරිශීලකයන්ගේ දත්ත</h4>
                            <div class="overflow-x-auto rounded-2xl border border-slate-700 bg-slate-800 custom-scrollbar shadow-inner">
                                <table class="w-full text-left text-sm text-slate-300 min-w-[600px]">
                                    <thead class="bg-slate-950 text-[10px] font-black uppercase text-slate-400 tracking-wider">
                                        <tr>
                                            <th class="px-5 py-4">නම සහ විද්‍යුත් තැපෑල</th>
                                            <th class="px-5 py-4">Level / XP</th>
                                            <th class="px-5 py-4">Focus Time</th>
                                            <th class="px-5 py-4">Streak</th>
                                            <th class="px-5 py-4">Joined Date</th>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-slate-700/50">
                                        ${window.adminUsersData.map(u => `
                                            <tr class="hover:bg-slate-700/50 transition-colors">
                                                <td class="px-5 py-4"><p class="font-bold text-white text-base">${u.name || 'Unknown'}</p><p class="text-xs text-slate-400">${u.email || 'No email'}</p></td>
                                                <td class="px-5 py-4"><span class="bg-indigo-500/20 text-indigo-300 px-2 py-1 rounded-lg text-xs font-black border border-indigo-500/30">Lvl ${u.level||1}</span> <span class="text-xs ml-2 text-slate-400 font-bold">${u.xp||0} XP</span></td>
                                                <td class="px-5 py-4 text-emerald-400 font-bold">${Math.floor((u.totalFocusMinutes||0)/60)}h ${(u.totalFocusMinutes||0)%60}m</td>
                                                <td class="px-5 py-4 text-orange-400 font-bold">${u.streakCount||0} 🔥</td>
                                                <td class="px-5 py-4 text-xs text-slate-400 font-medium">${u.joined || '-'}</td>
                                            </tr>
                                        `).join('')}
                                        ${window.adminUsersData.length === 0 ? '<tr><td colspan="5" class="text-center py-8 text-slate-500 font-bold">පරිශීලකයන් පූරණය වෙමින් පවතී හෝ කිසිවෙකු නොමැත...</td></tr>' : ''}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                        
                        <!-- 2. PUBLISH ARTICLES -->
                        <div class="pt-6 border-t border-slate-800 space-y-4">
                            <h4 class="font-bold text-emerald-400 mb-4 flex items-center gap-2 text-lg"><span>📢</span> Cloud Database වෙත නව ලිපියක් Publish කරන්න</h4>
                            <input type="text" id="admin-art-title" placeholder="මාතෘකාව (Title)" class="w-full p-4 bg-slate-950 rounded-xl outline-none border border-slate-800 text-sm focus:border-indigo-500 transition-colors font-bold"/>
                            <input type="text" id="admin-art-author" placeholder="කර්තෘ (Author - විකල්ප)" value="MindsetOS Admin" class="w-full p-4 bg-slate-950 rounded-xl outline-none border border-slate-800 text-sm focus:border-indigo-500 transition-colors font-bold"/>
                            <div class="flex space-x-3">
                                <input type="text" id="admin-art-cat" placeholder="කාණ්ඩය (උදා: Study, Health)" class="w-full p-4 bg-slate-950 rounded-xl outline-none border border-slate-800 text-sm focus:border-indigo-500 transition-colors font-bold"/>
                                <input type="text" id="admin-art-time" placeholder="කියවීමට කාලය (උදා: විනාඩි 5)" class="w-full p-4 bg-slate-950 rounded-xl outline-none border border-slate-800 text-sm focus:border-indigo-500 transition-colors font-bold"/>
                            </div>
                            <textarea id="admin-art-intro" placeholder="කෙටි හැඳින්වීම (Intro)..." class="w-full p-4 bg-slate-950 rounded-xl outline-none border border-slate-800 text-sm h-20 resize-none focus:border-indigo-500 transition-colors font-bold"></textarea>
                            <textarea id="admin-art-text" placeholder="සම්පූර්ණ අන්තර්ගතය (Main Content)..." class="w-full p-4 bg-slate-950 rounded-xl outline-none border border-slate-800 text-sm h-32 resize-none focus:border-indigo-500 transition-colors font-bold"></textarea>
                            <button id="publish-btn" onclick="publishAdminArticle()" class="w-full bg-emerald-600 hover:bg-emerald-500 py-4 rounded-xl font-black transition-colors shadow-lg">ලිපිය Publish කරන්න (Global)</button>
                        </div>

                        <!-- 3. MANAGE PUBLISHED ARTICLES -->
                        <div class="pt-8 mt-8 border-t border-slate-800 space-y-4">
                            <h4 class="font-bold text-rose-400 mb-4 flex items-center gap-2 text-lg"><span>🗑️</span> පළකළ ලිපි කළමනාකරණය</h4>
                            <div class="space-y-2 max-h-60 overflow-y-auto pr-2 custom-scrollbar">
                                ${renderedArticleList}
                            </div>
                        </div>
                    </div>
                    <!-- ADMIN PANEL END -->
                    ` : ''}

                    <div class="p-6 bg-indigo-50 dark:bg-indigo-900/20 rounded-2xl border border-indigo-100 dark:border-indigo-800/50 mb-6">
                        <h3 class="text-xl font-black mb-2 text-indigo-900 dark:text-indigo-300">දත්ත ආරක්ෂිතව තබාගන්න</h3>
                        <p class="text-sm text-slate-600 dark:text-slate-400 mb-4">ඔබේ වැඩ සහ ප්‍රගතිය (JSON) Download කර තබාගන්න.</p>
                        <div class="flex flex-col sm:flex-row gap-3">
                            <button onclick="exportData()" class="flex-1 py-3 bg-indigo-600 text-white font-black rounded-xl hover:bg-indigo-700 flex items-center justify-center space-x-2"><span class="text-lg">⬇️</span><span>Backup ගන්න</span></button>
                            <label class="flex-1 py-3 bg-white dark:bg-slate-800 text-indigo-600 dark:text-indigo-400 font-black rounded-xl border-2 border-indigo-200 dark:border-indigo-800 hover:bg-indigo-50 dark:hover:bg-indigo-900/30 flex items-center justify-center space-x-2 cursor-pointer">
                                <span class="text-lg">⬆️</span><span>Restore කරන්න</span><input type="file" accept=".json" class="hidden" onchange="importData(event)" />
                            </label>
                        </div>
                    </div>

                    <div>
                        <label class="font-black text-sm block mb-2">විභාගය/ඉලක්ක දිනය:</label>
                        <input type="date" value="${state.user.targetDate}" onchange="updateTargetDate(this.value)" class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 outline-none mb-4 font-bold" />
                    </div>
                    <div>
                        <button onclick="addCustomCategory()" class="w-full py-4 border-2 border-indigo-200 dark:border-indigo-900 text-indigo-600 dark:text-indigo-400 font-black rounded-2xl hover:bg-indigo-50 dark:hover:bg-indigo-900/30">අලුත් කාණ්ඩයක් (Category) එක් කරන්න</button>
                    </div>

                    <div class="pt-6 border-t border-slate-200 dark:border-slate-700 space-y-4">
                        <button onclick="logout()" class="w-full py-4 bg-slate-100 dark:bg-slate-800 font-black rounded-2xl hover:bg-slate-200 dark:hover:bg-slate-700">ගිණුමෙන් ඉවත් වන්න (Logout)</button>
                        <button onclick="showConfirmModal('ඔබගේ සියලුම දත්ත මකා දැමීමට අවශ්‍යද? මෙය නැවත ලබා ගත නොහැක.', () => { localStorage.removeItem('mindsetos_fallback_db'); location.reload(); })" class="w-full py-4 border-2 border-red-200 text-red-500 font-black rounded-2xl hover:bg-red-50 dark:hover:bg-red-900/20">සම්පූර්ණ ගිණුම මකා දමන්න</button>
                    </div>
                </div>
            </div>`;
        }
    </script>
</body>
</html>
