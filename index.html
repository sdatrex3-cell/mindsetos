        }

            background-color: #0f172a;

            background-attachment: fixed;
        }

        /* Glassmorphism Styles */
        .glass-panel { background: rgba(255, 255, 255, 0.45); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border: 1px solid rgba(255, 255, 255, 0.6); box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.05); transition: all 0.3s ease; }
        .dark .glass-panel { background: rgba(15, 23, 42, 0.55); border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3); }
        .glass-nav { background: rgba(255, 255, 255, 0.6); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); transition: all 0.3s ease; }
        .dark .glass-nav { background: rgba(30, 41, 59, 0.65); border-right: 1px solid rgba(51, 65, 85, 0.3); border-bottom: 1px solid rgba(51, 65, 85, 0.3); }
        .glass-btn { background: rgba(255, 255, 255, 0.5); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.6); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .dark .glass-btn { background: rgba(30, 41, 59, 0.5); border: 1px solid rgba(255, 255, 255, 0.1); }
        .glass-btn:hover { background: rgba(255, 255, 255, 0.8); transform: translateY(-2px); }
        .dark .glass-btn:hover { background: rgba(51, 65, 85, 0.8); }

        button { transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.2s ease, opacity 0.2s ease; }
        button:active { transform: scale(0.96) !important; }

        .animate-fade-in { animation: fadeIn 0.5s ease-out forwards; }
        .animate-slide-up { animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        .card-hover:hover { transform: translateY(-5px); box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.5); border-radius: 10px; }
        .dark ::-webkit-scrollbar-thumb { background: rgba(71, 85, 105, 0.5); }
        .custom-scrollbar::-webkit-scrollbar { height: 8px; width: 8px; }
        
        .timer-circle { border-radius: 50%; }
        .perspective { perspective: 1000px; }
        .preserve-3d { transform-style: preserve-3d; transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1); }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
        .chart-container { position: relative; width: 100%; max-width: 800px; margin-left: auto; margin-right: auto; height: 250px; max-height: 300px; }
        
        @media print {
            body { background: white !important; color: black !important; }

        function playAlarm() {
            initAudioCtx();
            try {
                if (!audioCtxObj) return;
                const playTone = (freq, startTime, duration) => {
                    const osc = audioCtxObj.createOscillator(); const gain = audioCtxObj.createGain();
                    osc.connect(gain); gain.connect(audioCtxObj.destination);
                    osc.type = 'sine'; osc.frequency.setValueAtTime(freq, startTime);
                    gain.gain.setValueAtTime(1, startTime); gain.gain.exponentialRampToValueAtTime(0.01, startTime + duration);
                    osc.start(startTime); 
                    try { osc.stop(startTime + duration); } catch (e) {}
                };
                const now = audioCtxObj.currentTime;
                playTone(880, now, 0.2); playTone(1046, now + 0.3, 0.4); 
            } catch(e) {}
        }

            if (state.streak.lastDate === yestStr) {

        function checkNewDay() {
            if (state.isNewUser) return;
            const today = getTodayStr(); 
            let stateMutated = false;

            const yest = new Date(); yest.setDate(yest.getDate() - 1);
            const yestStr = yest.getFullYear() + '-' + String(yest.getMonth() + 1).padStart(2, '0') + '-' + String(yest.getDate()).padStart(2, '0');

            if (state.streak.lastDate && state.streak.lastDate !== today && state.streak.lastDate !== yestStr) {
                if (state.streak.count !== 0) {
                    state.streak.count = 0;
                    stateMutated = true;
                }
            }

            if (!state.lastLoginDate) state.lastLoginDate = state.streak.lastDate || today;

            if (state.lastLoginDate !== today) {
                const completedPast = state.habits.filter(h => h.completed);
                if(completedPast.length > 0) state.pastTasks[state.lastLoginDate] = completedPast;
                
                const recurringTasks = state.habits.filter(h => h.isRecurring);
                
                state.habits = state.habits.filter(h => !h.completed).map(h => ({ ...h, completed: false }));
                
                recurringTasks.forEach(h => {
                    if(!state.habits.some(existing => existing.text === h.text && existing.date === today)) {
                        state.habits.unshift({...h, id: Date.now()+Math.random(), completed: false, xpAwarded: false, date: today});
                    }
                });

                state.lastLoginDate = today;
                updateHistory();
                saveData();
                stateMutated = true;
            }

            if (stateMutated) render();
        }

        function setSoundType(type) { state.soundType = type; saveData(true); if(audioCtxObj){ toggleFocusSound(); toggleFocusSound(); } }
        
        function toggleFocusSound() {
            if (audioCtxObj) { 
                audioCtxObj.close(); audioCtxObj = null; noiseSourceNode = null; activeOscillators.forEach(o => o.stop()); activeOscillators = []; return; 
            }
            try {
                const AC = window.AudioContext || window.webkitAudioContext;
                if (!AC) return showToast("Audio API not supported in your browser.", "error");
                audioCtxObj = new AC();
                if (audioCtxObj.state === 'suspended') audioCtxObj.resume();
                
                if (state.soundType === 'binaural') {
                    const osc1 = audioCtxObj.createOscillator(); osc1.frequency.value = 200;
                    const osc2 = audioCtxObj.createOscillator(); osc2.frequency.value = 210;
                    const gainNode = audioCtxObj.createGain(); gainNode.gain.value = 0.5;
                    if (audioCtxObj.createStereoPanner) {
                        const panL = audioCtxObj.createStereoPanner(); panL.pan.value = -1;
                        const panR = audioCtxObj.createStereoPanner(); panR.pan.value = 1;
                        osc1.connect(panL); panL.connect(gainNode); osc2.connect(panR); panR.connect(gainNode);
                    } else { osc1.connect(gainNode); osc2.connect(gainNode); }
                    gainNode.connect(audioCtxObj.destination); osc1.start(); osc2.start(); activeOscillators.push(osc1, osc2);
                } else {
                    const buffer = audioCtxObj.createBuffer(1, audioCtxObj.sampleRate * 2, audioCtxObj.sampleRate);
                    const data = buffer.getChannelData(0);
                    for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
                    noiseSourceNode = audioCtxObj.createBufferSource(); noiseSourceNode.buffer = buffer; noiseSourceNode.loop = true;
                    const filter = audioCtxObj.createBiquadFilter(); 
                    if (state.soundType === 'rain') { filter.type = 'lowpass'; filter.frequency.value = 200; } else { filter.type = 'lowpass'; filter.frequency.value = 400; }
                    noiseSourceNode.connect(filter); filter.connect(audioCtxObj.destination); noiseSourceNode.start();
                }
                showToast('Focus sound enabled', 'success');
            } catch(e) { console.log(e); }
        }

        function updateTimerSettings(type, val) {
            let num = parseInt(val); if (isNaN(num) || num < 1) num = 1;
            if (!state.timerSettings) state.timerSettings = { focus: 25, break: 5 };
            state.timerSettings[type] = num; saveData(true);
            if (timerState.phase === 'idle' && type === 'focus') { timerState.timeLeft = num * 60; updateTimerUI(); }
        }

        function toggleTimer() {
            initAudioCtx();
            if ('Notification' in window && Notification.permission !== 'granted' && Notification.permission !== 'denied') Notification.requestPermission();
            
            if (timerState.phase === 'running' || timerState.phase === 'break-running') { 
                clearInterval(timerState.interval); timerState.targetEndTime = null; timerState.phase = timerState.phase === 'running' ? 'paused' : 'break-paused'; 
            } else if (timerState.phase === 'paused' || timerState.phase === 'break-paused') {
                timerState.phase = timerState.phase === 'paused' ? 'running' : 'break-running'; startTimerInterval();
            } else {
                timerState.phase = timerState.mode === 'focus' ? 'running' : 'break-running'; startTimerInterval();
            }
            render();
        }

        function startTimerInterval() {
            clearInterval(timerState.interval);
            timerState.targetEndTime = Date.now() + (timerState.timeLeft * 1000);
            timerState.interval = setInterval(() => {
                if (timerState.timeLeft > 0 && timerState.targetEndTime) { 
                    const now = Date.now(); timerState.timeLeft = Math.max(0, Math.round((timerState.targetEndTime - now) / 1000)); updateTimerUI(); 
                } 
                if (timerState.timeLeft <= 0 && timerState.targetEndTime !== null) {
                    clearInterval(timerState.interval); timerState.targetEndTime = null; playAlarm(); 
                    if(timerState.mode === 'focus') { 
                        updateStreakAction();
                        let focusMins = state.timerSettings?.focus || 25; addXP(focusMins); state.stats.totalFocusMinutes += focusMins; 
                        const today = getTodayStr(); state.dailyFocus[today] = (state.dailyFocus[today] || 0) + focusMins; saveData(true); 
                        timerState.phase = 'focus-ended'; showToast("Focus session ended!", "success"); triggerPushNotification("Focus session ended! Take a break.");
                    } else { showToast("Break is over!", "info"); triggerPushNotification("Break is over! Time to get back to work."); resetTimer(); }
                    render();
                }
            }, 1000);
        }
        
        function resetTimer() { clearInterval(timerState.interval); timerState.targetEndTime = null; timerState.mode = 'focus'; timerState.phase = 'idle'; timerState.timeLeft = (state.timerSettings?.focus || 25) * 60; render(); }
        function startBreakManual() { timerState.mode = 'break'; timerState.timeLeft = (state.timerSettings?.break || 5) * 60; timerState.phase = 'break-running'; initAudioCtx(); startTimerInterval(); render(); }
        function skipBreakManual() { resetTimer(); render(); }
        
        function updateTimerUI() {
            const el = document.getElementById('timer-display');
            if(el) el.innerText = `${Math.floor(timerState.timeLeft / 60).toString().padStart(2, '0')}:${(timerState.timeLeft % 60).toString().padStart(2, '0')}`;
            const circle = document.getElementById('timer-circle-bg');
            const totalSecs = timerState.mode === 'focus' ? (state.timerSettings?.focus || 25) * 60 : (state.timerSettings?.break || 5) * 60;
            if(circle) circle.style.background = `conic-gradient(${timerState.mode === 'focus' ? (state.user.theme === 'dark' ? '#6366f1' : '#4f46e5') : '#10b981'} ${((totalSecs - timerState.timeLeft) / totalSecs) * 100}%, transparent 0deg)`;
        }

            `;
            
            const reflections = Object.keys(state.reflections).sort((a,b) => new Date(b) - new Date(a));
            if(reflections.length === 0) html += `<p class="content">No journal entries found.</p>`;
            reflections.forEach(d => {
                html += `<div class="item"><div class="date">${d}</div><div class="content">${escapeHTML(state.reflections[d])}</div></div>`;
            });

            html += `<h2>Past Completed Tasks</h2>`;
            const pastTasks = Object.keys(state.pastTasks).sort((a,b) => new Date(b) - new Date(a));
            if(pastTasks.length === 0) html += `<p class="content">No past tasks found.</p>`;
            pastTasks.forEach(d => {
                html += `<div class="item"><div class="date">${d}</div><ul class="content">`;
                state.pastTasks[d].forEach(task => {
                    html += `<li>${escapeHTML(task.text)} ${task.time ? `(${escapeHTML(task.time)})`:''}</li>`;
                });
                html += `</ul></div>`;
            });

            html += `</body></html>`;
            
            printWindow.document.write(html);
            printWindow.document.close();
            printWindow.focus();
            
            setTimeout(() => {
                printWindow.print();
            }, 500);

        function importData(event) {
            const file = event.target.files[0]; if (!file) return; const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    if (data && data.user) { state = { ...state, ...data }; saveData(true); showToast("Restore Success!", "success"); render(); } 
                    else showToast("Invalid Backup File!", "error");
                } catch (err) { showToast("Error reading file!", "error"); }
            };
            reader.readAsText(file);
        }

        function setRating(r) { state.appRating = r; render(); }
        
        function submitFeedback() {
            const text = document.getElementById('feedback-text')?.value;
            if(!text && !state.appRating) return showToast("Please provide some feedback or a rating.", "error");
            
            const safeText = (text || '').substring(0, 1500);
            const subject = encodeURIComponent(`MindsetOS Feedback - Rating: ${state.appRating || 0}/5`);
            const body = encodeURIComponent(`From: ${state.user.name} (${state.user.email})\nLevel: ${state.user.level}\n\nFeedback:\n${safeText || 'No text provided.'}`);
            
            const mailtoLink = `mailto:${MY_ADMIN_EMAIL}?subject=${subject}&body=${body}`;
            window.open(mailtoLink, '_blank', 'noopener,noreferrer');
            
            showToast("Opening Email Client...", "success");
            state.appRating = 0;
            if(document.getElementById('feedback-text')) document.getElementById('feedback-text').value = '';
            render();
        }

        function generateHeatmap() {
            let html = '<div class="flex flex-wrap gap-2 justify-center mt-6" role="img" aria-label="Activity Heatmap">';
            
            const baseDate = new Date();
            const baseTime = baseDate.getTime();
            
            for(let i=89; i>=0; i--) { 
                const d = new Date(baseTime - (i * 24 * 60 * 60 * 1000));
                const dateStr = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
                const focus = state.dailyFocus[dateStr] || 0;
                let color = 'bg-slate-200 dark:bg-slate-800 opacity-50'; 
                if(focus > 0) color = 'bg-indigo-300 dark:bg-indigo-900';
                if(focus > 25) color = 'bg-indigo-400 dark:bg-indigo-700';
                if(focus > 60) color = 'bg-indigo-500 dark:bg-indigo-500';
                if(focus > 120) color = 'bg-indigo-600 dark:bg-indigo-400';
                html += `<div class="w-4 h-4 rounded-sm ${color} transition-all hover:scale-125 cursor-pointer" title="${dateStr}: ${focus} ${t('minutes')}"></div>`;
            }
            html += '</div>'; return html;
        }
        
        function addXP(amount) { 
            if (state.user.level >= 100) return; 
            state.user.xp += amount; let leveledUp = false;
            while (state.user.xp >= state.user.level * 100 && state.user.level < 100) { state.user.xp -= state.user.level * 100; state.user.level++; leveledUp = true; } 
            if (state.user.level >= 100) { state.user.level = 100; state.user.xp = 0; }
            if(leveledUp) { const title = getLevelName(state.user.level).split(' ')[0]; showToast(`🎉 Level Up! Level ${state.user.level} - ${title}`, 'success'); checkBadges(); }
            saveData(true); 
            updatePublicLeaderboard();
            fetchLeaderboard();
            render();
        }

        function initCharts() {
            if (typeof Chart === 'undefined') return;
            const ctx1 = document.getElementById('progressChart');
            if(ctx1) {
                if(progressChartInstance) progressChartInstance.destroy();
                const sortedHistory = state.history.sort((a,b) => new Date(a.date) - new Date(b.date));
                const labels = sortedHistory.length ? sortedHistory.map(d => d.date) : [t('today')];
                const data = sortedHistory.length ? sortedHistory.map(d => d.score) : [0];
                progressChartInstance = new Chart(ctx1, { type: 'line', data: { labels: labels, datasets: [{ label: t('percent'), data: data, borderColor: '#6366f1', backgroundColor: 'rgba(99, 102, 241, 0.2)', borderWidth: 3, tension: 0.4, fill: true }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { max: 100, beginAtZero: true } } } });
            }
            const ctx2 = document.getElementById('focusChart');
            if(ctx2) {
                if(focusChartInstance) focusChartInstance.destroy();
                const focusDates = Object.keys(state.dailyFocus).sort((a,b) => new Date(a) - new Date(b)).slice(-7); 
                const focusData = focusDates.map(d => state.dailyFocus[d]);
                focusChartInstance = new Chart(ctx2, { type: 'bar', data: { labels: focusDates, datasets: [{ label: t('minutes'), data: focusData, backgroundColor: '#10b981', borderRadius: 8 }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } } });
            }
            const ctx3 = document.getElementById('moodFocusChart');
            if(ctx3) {
                const moodGroups = { 'great': [], 'good': [], 'neutral': [], 'bad': [] };
                Object.keys(state.moods).forEach(d => { if(state.dailyFocus[d]) moodGroups[state.moods[d]].push(state.dailyFocus[d]); });
                const moodAverages = Object.keys(moodGroups).map(m => moodGroups[m].length ? moodGroups[m].reduce((a,b)=>a+b,0)/moodGroups[m].length : 0);
                new Chart(ctx3, { type: 'bar', data: { labels: ['🤩 Great', '😊 Good', '😐 Neutral', '😫 Bad'], datasets: [{ label: 'Avg Focus (Mins)', data: moodAverages, backgroundColor: ['#8b5cf6', '#10b981', '#f59e0b', '#ef4444'], borderRadius: 8 }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } } });
            }
        }

                <div class="mb-6">${holidayBanner}${targetHTML}${articleNotif}${reviewNotifs}</div>

                <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                    <button onclick="window.switchTab('timer')" aria-label="Deep Work Timer" class="glass-panel p-4 rounded-2xl shadow-sm flex items-center justify-center space-x-3 hover:bg-indigo-50/50 dark:hover:bg-indigo-900/50 transition-colors group"><span class="text-xl group-hover:scale-110 transition-transform drop-shadow">▶️</span><span class="font-bold text-sm">${t('deep_work')}</span></button>
                    <button onclick="window.switchTab('planner')" aria-label="New Task" class="glass-panel p-4 rounded-2xl shadow-sm flex items-center justify-center space-x-3 hover:bg-indigo-50/50 transition-colors group"><span class="text-xl group-hover:scale-110 transition-transform drop-shadow">➕</span><span class="font-bold text-sm">${t('new_task')}</span></button>
                    <button onclick="window.switchTab('flashcards')" aria-label="Flashcards" class="glass-panel p-4 rounded-2xl shadow-sm flex items-center justify-center space-x-3 hover:bg-indigo-50/50 transition-colors group"><span class="text-xl group-hover:scale-110 transition-transform drop-shadow">🗂️</span><span class="font-bold text-sm">${t('flashcards')}</span></button>
                    <button onclick="window.shareToWhatsApp()" aria-label="Share via WhatsApp" class="glass-panel p-4 rounded-2xl shadow-sm flex items-center justify-center space-x-3 hover:bg-[#25D366]/10 transition-colors group"><span class="text-xl group-hover:scale-110 transition-transform text-[#25D366]">🔗</span><span class="font-bold text-sm text-[#25D366]">Share</span></button>
                </div>
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                    <div class="space-y-8"><div class="glass-panel rounded-[3rem] p-10 shadow-sm relative overflow-hidden"><div class="absolute top-0 right-0 p-8 opacity-10 text-9xl">🎯</div><h4 class="font-black text-slate-500 dark:text-slate-400 uppercase text-xs tracking-widest mb-6 relative z-10">${t('daily_progress')}</h4><div class="flex items-baseline relative z-10 drop-shadow-md"><span class="text-7xl font-black">${score}</span><span class="text-3xl font-black text-slate-400">%</span></div><div class="w-full bg-slate-200/50 dark:bg-slate-800/50 h-6 rounded-full overflow-hidden p-1 mt-8 relative z-10"><div class="bg-gradient-to-r from-indigo-500 to-purple-500 h-full rounded-full transition-all duration-1000 shadow-[0_0_15px_rgba(99,102,241,0.5)]" style="width:${score}%"></div></div></div></div>
                    <div class="lg:col-span-2 space-y-8"><div class="glass-panel rounded-[3rem] p-8 md:p-10 shadow-sm"><div class="flex justify-between items-center mb-6"><h4 class="font-black text-lg flex items-center space-x-3 drop-shadow-sm"><span class="text-2xl">🕒</span><span>${t('up_next')}</span></h4><button onclick="window.switchTab('planner')" class="text-sm font-bold text-indigo-600 dark:text-indigo-400 hover:underline">${t('view_all')}</button></div><div class="space-y-3">${pendingTasks.length === 0 ? `<div class="text-center py-8 text-slate-500 font-bold">${t('all_done')}</div>` : pendingTasks.map(h => `<div class="flex items-center justify-between p-4 glass-btn rounded-2xl cursor-pointer hover:scale-[1.01] transition-transform" onclick="window.toggleHabit(${h.id})" role="button" aria-label="Toggle Habit"><div class="flex items-center space-x-4"><div class="w-8 h-8 rounded-lg border-2 border-slate-300 dark:border-slate-500 flex items-center justify-center">${h.completed ? '✓' : ''}</div><div><p class="font-bold drop-shadow-sm">${escapeHTML(h.text)}</p></div></div><button onclick="event.stopPropagation(); window.switchTab('timer')" aria-label="Start Timer" class="text-xl hover:scale-110 transition-transform">▶️</button></div>`).join('')}</div></div></div>
                </div>
            </div>`;
        }

        function renderPlanner() {
            const today = getTodayStr();
            let historyHTML = '';
            const pastDates = Object.keys(state.pastTasks).sort((a,b) => new Date(b) - new Date(a));
            if(pastDates.length > 0 || Object.keys(state.reflections).length > 1) {
                historyHTML = `<div class="mt-12 pt-8 border-t border-slate-300 dark:border-slate-700"><h3 class="text-2xl font-black mb-6 drop-shadow-sm flex items-center gap-2"><span>🕰️</span> ${t('history')}</h3><div class="space-y-6">`;
                const allDates = new Set([...pastDates, ...Object.keys(state.reflections)]);
                Array.from(allDates).sort((a,b) => new Date(b) - new Date(a)).forEach(d => {
                    if (d === today) return; 
                    historyHTML += `<div class="glass-panel p-6 rounded-3xl"><h4 class="font-bold text-indigo-600 dark:text-indigo-400 mb-3">${escapeHTML(d)}</h4>`;
                    if (state.pastTasks[d] && state.pastTasks[d].length > 0) {
                        historyHTML += `<div class="mb-3"><p class="text-xs uppercase font-bold text-slate-500 mb-2">Tasks</p><ul class="list-disc list-inside pl-4 text-sm font-medium space-y-1 opacity-80">`;
                        state.pastTasks[d].forEach(task => { historyHTML += `<li>${escapeHTML(task.text)} ${task.time ? `(${escapeHTML(task.time)})`:''}</li>`; });
                        historyHTML += `</ul></div>`;
                    }
                    if (state.reflections[d]) {
                        historyHTML += `<div><p class="text-xs uppercase font-bold text-slate-500 mb-2">Journal</p><p class="text-sm font-medium italic opacity-90 border-l-2 border-indigo-400 pl-3">${escapeHTML(state.reflections[d])}</p></div>`;
                    }
                    historyHTML += `</div>`;
                });
                historyHTML += `</div></div>`;
            }

            return `<div class="max-w-4xl mx-auto space-y-8 pb-10">
                <header class="text-center"><h2 class="text-4xl font-black tracking-tight drop-shadow-md">${t('planner')}</h2></header>
                
                <div class="glass-panel p-6 rounded-[2rem] shadow-sm space-y-4">
                    <div class="flex flex-col md:flex-row gap-3">
                        <input type="text" id="habit-text" aria-label="Task Description" onkeydown="if(event.key==='Enter')window.addHabit()" placeholder="${t('add_task')}" class="flex-1 px-4 py-3 glass-btn rounded-xl outline-none font-bold"/>
                        <input type="time" id="habit-time" aria-label="Task Time" class="px-4 py-3 glass-btn rounded-xl outline-none font-bold text-slate-600 dark:text-slate-300"/>
                        <select id="habit-priority" aria-label="Task Priority" class="px-4 py-3 glass-btn rounded-xl font-bold">${Object.keys(priorities).map(k => `<option value="${escapeHTML(k)}">${escapeHTML(priorities[k].name)}</option>`).join('')}</select>
                        <select id="habit-cat" aria-label="Task Category" class="px-4 py-3 glass-btn rounded-xl font-bold">${Object.keys(state.categories).map(k => `<option value="${escapeHTML(k)}">${escapeHTML(state.categories[k].name)}</option>`).join('')}</select>
                    </div>
                    <div class="flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
                        <div class="flex items-center space-x-4">
                            <label class="flex items-center space-x-2 cursor-pointer font-bold text-sm text-slate-600 dark:text-slate-400">
                                <input type="checkbox" id="habit-review" aria-label="Review Reminder" class="w-5 h-5 rounded text-indigo-600 accent-indigo-600"/>
                                <span>${t('review_chk')}</span>
                            </label>
                            <label class="flex items-center space-x-2 cursor-pointer font-bold text-sm text-slate-600 dark:text-slate-400">
                                <input type="checkbox" id="habit-recurring" aria-label="Recurring Habit" class="w-5 h-5 rounded text-emerald-600 accent-emerald-600"/>
                                <span>Daily / දිනපතා</span>
                            </label>
                        </div>
                        <button onclick="window.addHabit()" class="bg-indigo-600 text-white px-8 py-3 rounded-xl font-black shadow-lg hover:bg-indigo-500 w-full md:w-auto">${t('add_btn')}</button>
                    </div>
                </div>

                <div class="space-y-4">
                    ${state.habits.map(h => {
                        const cat = state.categories[h.category] || { name: 'General', color: 'bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-300' };
                        const pri = priorities[h.priority] || priorities['Q3'];
                        return `<div class="flex items-center justify-between p-5 glass-panel rounded-[1.5rem] card-hover ${h.completed ? 'opacity-50' : ''}">
                        <div class="flex items-center space-x-4">
                            <button onclick="window.toggleHabit(${h.id})" aria-label="Toggle Habit Completion" class="w-12 h-12 rounded-xl border-2 flex items-center justify-center text-xl font-black shrink-0 transition-colors ${h.completed?'bg-indigo-600 border-indigo-600 text-white':'border-slate-400 hover:bg-slate-100'}">${h.completed?'✓':''}</button>
                            <div>
                                <p class="font-black text-xl break-words w-full ${h.completed?'line-through':''}">${escapeHTML(h.text)}</p>
                                <div class="flex flex-wrap gap-2 mt-2">
                                    ${h.time ? `<span class="bg-slate-200 text-slate-700 dark:bg-slate-700 dark:text-slate-300 text-[10px] font-bold px-2 py-1 rounded-md shadow-sm">⏰ ${escapeHTML(h.time)}</span>` : ''}
                                    <span class="${escapeHTML(cat.color)} text-[10px] font-bold px-2 py-1 rounded-md shadow-sm border border-current opacity-80">${escapeHTML(cat.name.split('/')[0].trim())}</span>
                                    <span class="${escapeHTML(pri.class)} text-[10px] font-bold px-2 py-1 rounded-md shadow-sm border border-current opacity-80">${escapeHTML(pri.name)}</span>
                                    ${h.needsReview ? `<span class="bg-purple-100 text-purple-600 dark:bg-purple-900/50 dark:text-purple-300 text-[10px] font-bold px-2 py-1 rounded-md shadow-sm">🔄 Review</span>` : ''}
                                    ${h.isRecurring ? `<span class="bg-emerald-100 text-emerald-600 dark:bg-emerald-900/50 dark:text-emerald-300 text-[10px] font-bold px-2 py-1 rounded-md shadow-sm">🔁 Daily</span>` : ''}
                                    ${!h.completed ? `<button onclick="window.breakdownTaskAI(${h.id})" class="text-[10px] font-bold text-indigo-500 hover:underline">✨ AI Breakdown</button>` : ''}
                                </div>
                            </div>
                        </div>
                        <button onclick="window.deleteHabit(${h.id})" aria-label="Delete Task" class="p-3 text-slate-400 hover:text-red-500 text-xl shrink-0 transition-transform hover:scale-110">🗑️</button>
                    </div>`}).join('')}
                </div>

                <div class="glass-panel p-8 rounded-[2.5rem] shadow-sm space-y-6"><div><h3 class="text-2xl font-black mb-2 drop-shadow-sm">${t('journal')}</h3></div><div class="flex space-x-4 mb-4">${Object.keys(moodEmojis).map(m => `<button onclick="window.setMood('${m}')" aria-label="Set mood to ${m}" class="text-4xl hover:scale-125 transition-transform ${state.moods[today]===m?'scale-125 glass-btn rounded-full':''} drop-shadow">${moodEmojis[m]}</button>`).join('')}</div><textarea id="journal-text" aria-label="Journal Text" oninput="window.updateJournalTextSilent(this.value)" placeholder="${t('journal_ph')}" class="w-full glass-btn p-6 rounded-2xl outline-none font-medium text-lg h-32 resize-none focus:border-indigo-400 shadow-inner">${escapeHTML(state.reflections[today]||'')}</textarea><button onclick="window.saveJournal()" class="w-full py-4 bg-indigo-600 text-white font-black rounded-xl shadow-lg hover:bg-indigo-500">${t('save_journal')}</button></div>${historyHTML}
            </div>`;
        }

        function renderTimer() {
            let controlButtons = '';
            if (timerState.phase === 'focus-ended') {
                controlButtons = `<div class="flex justify-center space-x-4 mt-8 animate-fade-in"><button onclick="window.startBreakManual()" class="px-8 py-4 bg-emerald-500 text-white rounded-2xl font-black shadow-lg text-lg hover:bg-emerald-400">${t('start_break').replace('5m', escapeHTML(state.timerSettings?.break || 5) + 'm')}</button><button onclick="window.skipBreakManual()" class="px-8 py-4 glass-btn rounded-2xl font-black text-slate-500 dark:text-slate-300 transition-colors">${t('skip_break')}</button></div>`;
            } else {
                let icon = (timerState.phase === 'running' || timerState.phase === 'break-running') ? '⏸️' : '▶️';
                controlButtons = `<div class="flex justify-center space-x-6 mt-8"><button onclick="window.toggleTimer()" aria-label="Toggle Timer" class="w-20 h-20 rounded-full flex items-center justify-center text-white text-3xl shadow-xl transition-transform hover:scale-105 ${(timerState.phase==='running'||timerState.phase==='break-running')?'bg-rose-500':'bg-indigo-600'}"><span>${icon}</span></button><button onclick="window.resetTimer()" aria-label="Reset Timer" class="w-20 h-20 rounded-full flex items-center justify-center bg-slate-300 text-slate-700 text-3xl shadow-xl transition-transform hover:scale-105" title="${t('reset_timer')}"><span>⏹️</span></button></div>`;
            }

            let settingsUI = '';
            if (timerState.phase === 'idle') {
                settingsUI = `<div class="flex justify-center space-x-6 mb-8 animate-fade-in">
                    <div class="flex flex-col items-center"><label for="focus-time-input" class="text-[10px] font-bold text-slate-500 uppercase mb-1">Focus Time (Min)</label><input type="number" id="focus-time-input" value="${escapeHTML(state.timerSettings?.focus || 25)}" onchange="window.updateTimerSettings('focus', this.value)" class="w-20 px-3 py-2 text-center glass-btn rounded-xl font-black text-lg outline-none focus:border-indigo-500" min="1" max="120"></div>
                    <div class="flex flex-col items-center"><label for="break-time-input" class="text-[10px] font-bold text-slate-500 uppercase mb-1">Break Time (Min)</label><input type="number" id="break-time-input" value="${escapeHTML(state.timerSettings?.break || 5)}" onchange="window.updateTimerSettings('break', this.value)" class="w-20 px-3 py-2 text-center glass-btn rounded-xl font-black text-lg outline-none focus:border-indigo-500" min="1" max="30"></div>
                </div>`;
            }

            return `<div class="max-w-xl mx-auto space-y-10 text-center pb-20"><header><h2 class="text-4xl font-black drop-shadow-md">${t('timer_title')}</h2></header><div class="glass-panel p-12 rounded-[3rem] relative shadow-xl">
                <div class="flex flex-col items-center justify-center space-y-2 mb-8">
                    <div class="flex space-x-2">
                        <button onclick="window.toggleFocusSound()" class="px-4 py-2 rounded-lg text-xs font-bold border glass-btn shadow-sm hover:scale-105 transition-transform">${t('sound_beta')} ${audioCtxObj ? '🔊' : '🔇'}</button>
                    </div>
                    <select aria-label="Sound Settings" onchange="window.setSoundType(this.value)" class="bg-transparent text-xs font-bold text-slate-500 dark:text-slate-400 outline-none cursor-pointer">
                        <option value="noise" ${state.soundType==='noise'?'selected':''}>White Noise</option>
                        <option value="rain" ${state.soundType==='rain'?'selected':''}>Rain</option>
                        <option value="binaural" ${state.soundType==='binaural'?'selected':''}>Binaural Beats (Alpha)</option>
                    </select>
                </div>
                ${settingsUI}<div class="relative w-72 h-72 mx-auto mb-10 flex items-center justify-center"><div class="absolute inset-0 bg-slate-200/50 dark:bg-slate-700/50 rounded-full shadow-inner"></div><div id="timer-circle-bg" class="absolute inset-0 timer-circle transition-all duration-500"></div><div class="absolute inset-4 glass-panel rounded-full flex flex-col items-center justify-center"><span class="text-sm font-bold text-slate-500 uppercase tracking-widest mb-1">${escapeHTML(timerState.mode)} MODE</span><span id="timer-display" class="text-7xl font-black drop-shadow-md">${String(Math.floor(timerState.timeLeft / 60)).padStart(2, '0')}:${String(timerState.timeLeft % 60).padStart(2, '0')}</span></div></div>${controlButtons}</div></div>`;
        }

        function renderFlashcards() {
            const dueCards = state.flashcards.filter(f => !f.dueDate || f.dueDate <= Date.now());
            const futureCards = state.flashcards.length - dueCards.length;

            return `<div class="max-w-4xl mx-auto space-y-10 pb-20"><header class="text-center"><h2 class="text-4xl font-black drop-shadow-md">${t('flashcards')}</h2></header>
            <div class="glass-panel p-6 rounded-[2rem] flex flex-col space-y-4">
                <div class="flex flex-col md:flex-row gap-4">
                    <input type="text" id="fc-q" aria-label="Flashcard Question" placeholder="${t('q_ph')}" class="flex-1 px-4 py-3 glass-btn rounded-xl outline-none font-bold"/>
                    <input type="text" id="fc-a" aria-label="Flashcard Answer" placeholder="${t('a_ph')}" class="flex-1 px-4 py-3 glass-btn rounded-xl outline-none font-bold"/>
                    <button onclick="window.addFlashcard()" class="bg-indigo-600 text-white px-6 py-3 rounded-xl font-black">${t('add_btn')}</button>
                </div>
                <button onclick="window.generateAIFlashcards()" class="w-full py-3 border-2 border-indigo-200 dark:border-indigo-800 text-indigo-600 dark:text-indigo-400 font-bold rounded-xl hover:bg-indigo-50 dark:hover:bg-indigo-900/30 transition-colors flex justify-center items-center gap-2">✨ AI මගින් Flashcards සෑදීම</button>
            </div>
            
            ${futureCards > 0 ? `<div class="text-center font-bold text-emerald-600 dark:text-emerald-400 bg-emerald-50 dark:bg-emerald-900/20 p-3 rounded-xl border border-emerald-200 dark:border-emerald-800">🎉 Flashcards ${futureCards} ක් සාර්ථකව මතක තබාගෙන ඇත (Reviewed). අදට නියමිත ඒවා පහතින්:</div>` : ''}

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 perspective">${dueCards.length === 0 ? `<div class="col-span-full text-center py-10 text-slate-400 font-bold">${state.flashcards.length > 0 ? 'අද දිනට නියමිත Flashcards අවසන්!' : t('no_fc')}</div>` : dueCards.map(f => `<div class="relative h-56 w-full group cursor-pointer" onclick="window.flipCardDOM('${f.id}', this)" role="button" aria-label="Flip Flashcard"><div class="absolute inset-0 w-full h-full preserve-3d ${state.flippedCards[f.id] ? 'rotate-y-180' : ''}"><div class="absolute inset-0 backface-hidden glass-panel rounded-[2rem] p-6 flex flex-col justify-center items-center shadow-sm"><span class="text-xs font-bold text-indigo-500 mb-2">${t('fc_q')}</span><h3 class="text-xl font-black text-center break-words w-full">${escapeHTML(f.q)}</h3><button onclick="event.stopPropagation(); window.deleteFlashcard(${f.id})" aria-label="Delete Flashcard" class="absolute top-4 right-4 text-slate-400 hover:text-red-500 text-lg hover:scale-110 transition-transform">🗑️</button></div>
            <div class="absolute inset-0 backface-hidden rotate-y-180 bg-indigo-600/90 text-white rounded-[2rem] p-4 flex flex-col justify-between items-center shadow-md">
                <span class="text-xs font-bold text-indigo-200">${t('fc_a')}</span>
                <h3 class="text-2xl font-black text-center break-words w-full overflow-y-auto custom-scrollbar max-h-24">${escapeHTML(f.a)}</h3>
                <div class="flex gap-2 w-full mt-2">
                    <button onclick="event.stopPropagation(); window.rateFlashcard(${f.id}, 0)" class="flex-1 py-2 bg-red-500 hover:bg-red-400 text-white text-[10px] font-black rounded-lg shadow-sm">Hard</button>
                    <button onclick="event.stopPropagation(); window.rateFlashcard(${f.id}, 1)" class="flex-1 py-2 bg-yellow-500 hover:bg-yellow-400 text-white text-[10px] font-black rounded-lg shadow-sm">Good</button>
                    <button onclick="event.stopPropagation(); window.rateFlashcard(${f.id}, 2)" class="flex-1 py-2 bg-emerald-500 hover:bg-emerald-400 text-white text-[10px] font-black rounded-lg shadow-sm">Easy</button>
                </div>
            </div></div></div>`).join('')}</div></div>`;
        }

        function renderLibrary() {
            return `<div class="space-y-10 pb-20"><header><h2 class="text-4xl font-black mb-2 drop-shadow-md">${t('library')}</h2></header><div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">${articles.map(a => {
                const isRead = state.readArticles && state.readArticles.includes(a.id);
                // අලුත්: Admin ට පමණක් පෙනෙන Delete බොත්තම මෙහි ඇත
                return `<div onclick="window.viewArticle('${a.id}')" class="glass-panel rounded-[2.5rem] p-8 shadow-sm cursor-pointer card-hover relative" role="button" aria-label="View Article">
                    ${isAdmin() && a.id !== 'default-1' ? `<button onclick="event.stopPropagation(); window.deleteAdminArticle('${a.id}')" aria-label="Delete Article" class="absolute top-6 right-6 text-xl text-slate-400 hover:text-red-500 hover:scale-110 transition-transform z-10" title="Delete Article">🗑️</button>` : ''}
                    <div><div class="w-16 h-16 glass-btn rounded-2xl flex items-center justify-center mb-6 text-3xl drop-shadow-md">${escapeHTML(a.icon)}</div><h3 class="text-2xl font-black mb-3 drop-shadow-sm pr-8">${escapeHTML(a.title)}</h3><p class="text-slate-600 dark:text-slate-400 text-sm mb-6 line-clamp-3">${escapeHTML(a.excerpt)}</p></div><button class="w-full py-3 glass-btn font-bold rounded-xl ${isRead ? 'text-slate-500 dark:text-slate-500' : 'text-indigo-600 dark:text-indigo-400 hover:scale-105 transition-transform'} shadow-sm">${isRead ? t('read_done') : t('read_btn')}</button>
                </div>`;
            }).join('')}</div></div>`;
        }

        function renderArticleView() {
            const a = articles.find(x => x.id === state.selectedArticleId);
            if(!a) return '';
            return `<div class="max-w-3xl mx-auto space-y-10 pb-20 print-content"><div class="flex justify-between items-center print-hidden"><button onclick="window.switchTab('library')" class="glass-btn px-4 py-2 rounded-xl flex items-center space-x-2 font-bold shadow-sm"><span class="text-xl">⬅️</span><span>Back</span></button></div><h2 class="text-5xl font-black drop-shadow-md print-text-black">${escapeHTML(a.title)}</h2><div class="flex space-x-4 text-sm font-bold opacity-70"><span>Author: ${escapeHTML(a.author)}</span></div><p class="text-xl italic border-l-4 border-indigo-400 pl-6 print-text-black font-medium">${escapeHTML(a.intro)}</p>${a.sections.map(s=>`<div class="space-y-2"><h3 class="text-2xl font-black text-indigo-600 drop-shadow-sm">${escapeHTML(s.title)}</h3><p class="text-lg font-medium leading-relaxed whitespace-pre-wrap">${escapeHTML(s.text)}</p></div>`).join('')}</div>`;
        }

        function renderStats() {
            return `<div class="space-y-10 pb-20"><header class="text-center"><h2 class="text-4xl font-black drop-shadow-md">${t('stats')}</h2></header><div class="grid grid-cols-1 md:grid-cols-2 gap-6"><div class="glass-panel p-8 rounded-[2rem] text-center shadow-sm"><h4 class="text-5xl font-black mb-2 drop-shadow-md"><span class="inline-block">⌛</span> ${Math.floor((state.stats.totalFocusMinutes || 0)/60)}<span class="text-2xl text-slate-500">h</span> ${((state.stats.totalFocusMinutes || 0)%60)}<span class="text-2xl text-slate-500">m</span></h4><p class="font-bold uppercase tracking-widest text-xs text-slate-500">${t('total_focus')}</p></div><div class="glass-panel p-8 rounded-[2rem] text-center shadow-sm"><h4 class="text-5xl font-black mb-2 drop-shadow-md text-orange-500"><span class="inline-block">🔥</span> ${state.streak.count}</h4><p class="font-bold uppercase tracking-widest text-xs text-slate-500">Current Streak (Days)</p></div></div><div class="grid grid-cols-1 lg:grid-cols-2 gap-8"><div class="glass-panel p-8 rounded-[3rem] shadow-sm"><h4 class="font-black mb-6 text-center text-slate-600 dark:text-slate-300 drop-shadow-sm"><span class="inline-block">📈</span> ${t('progress_chart')}</h4><div class="chart-container"><canvas id="progressChart" aria-label="Progress Chart" role="img"></canvas></div></div><div class="glass-panel p-8 rounded-[3rem] shadow-sm"><h4 class="font-black mb-6 text-center text-slate-600 dark:text-slate-300 drop-shadow-sm"><span class="inline-block">📊</span> ${t('focus_chart')}</h4><div class="chart-container"><canvas id="focusChart" aria-label="Focus Time Chart" role="img"></canvas></div></div>
            <div class="glass-panel p-8 rounded-[3rem] shadow-sm lg:col-span-2">
                <h4 class="font-black mb-6 text-center text-slate-600 dark:text-slate-300 drop-shadow-sm"><span class="inline-block">🎭</span> Mood vs Focus Analytics</h4>
                <div class="chart-container"><canvas id="moodFocusChart" aria-label="Mood vs Focus Chart" role="img"></canvas></div>
            </div>
            <div class="glass-panel p-8 rounded-[3rem] shadow-sm lg:col-span-2">
                <h4 class="font-black mb-2 text-center text-slate-600 dark:text-slate-300 drop-shadow-sm">${t('heatmap_title')}</h4>
                <p class="text-xs text-center text-slate-500 mb-6">${t('heatmap_desc')}</p>
                ${generateHeatmap()}
            </div>
            </div></div>`;
        }

        function renderProfile() {
            const trialEnds = state.user.trialEnds || (Date.now() + (200 * 24 * 60 * 60 * 1000));
            const daysLeft = Math.max(0, Math.ceil((trialEnds - Date.now()) / (1000 * 60 * 60 * 24)));
            const userName = state.user.name || "User";
            
            let trialHTML = '';
            if (daysLeft > 0) {
                trialHTML = `<div class="bg-indigo-50 dark:bg-indigo-900/30 p-4 rounded-2xl mb-6 shadow-inner"><p class="text-sm font-bold text-slate-600 dark:text-slate-300">${t('trial_left')} <span class="text-indigo-600 dark:text-indigo-400 font-black text-xl ml-2">${daysLeft}</span></p></div>`;
            } else {
                trialHTML = `<div class="bg-rose-50 dark:bg-rose-900/30 p-4 rounded-2xl mb-6 shadow-inner"><p class="text-sm font-bold text-rose-600 dark:text-rose-400 mb-3">${t('trial_exp')}</p><button class="w-full py-3 bg-gradient-to-r from-rose-500 to-orange-500 text-white font-black rounded-xl shadow-lg">${t('subscribe')}</button></div>`;
            }

            let leaderboardHTML = '';
            if (globalLeaderboard && globalLeaderboard.length > 0) {
                leaderboardHTML = `
                <div class="glass-panel p-6 md:p-8 rounded-[3rem] shadow-sm mb-8 animate-slide-up">
                    <h3 class="text-xl font-black mb-6 text-indigo-600 dark:text-indigo-400 flex items-center justify-center space-x-2 drop-shadow-sm"><span class="inline-block">🏆</span> <span>${t('leaderboard_title')}</span></h3>
                    <div class="space-y-3">
                        ${globalLeaderboard.map((u, i) => {
                            const isMe = auth.currentUser && u.uid === auth.currentUser.uid;
                            let rankIcon = `${i+1}.`;
                            let iconClass = "text-slate-400";
                            if(i===0) { rankIcon = '🥇'; iconClass = "text-2xl drop-shadow-md"; }
                            else if(i===1) { rankIcon = '🥈'; iconClass = "text-2xl drop-shadow-md"; }
                            else if(i===2) { rankIcon = '🥉'; iconClass = "text-2xl drop-shadow-md"; }
                            
                            const uName = u.name || "User";
                            return `<div class="flex items-center justify-between p-3 rounded-2xl ${isMe ? 'bg-indigo-100 dark:bg-indigo-900/50 border border-indigo-300 dark:border-indigo-700 scale-105 transition-transform' : 'bg-slate-50 dark:bg-slate-800/50 hover:scale-[1.02] transition-transform'}">
                                <div class="flex items-center space-x-3">
                                    <span class="font-black text-lg w-6 text-center ${iconClass}">${rankIcon}</span>
                                    <div class="w-8 h-8 rounded-full bg-gradient-to-br from-indigo-400 to-purple-500 text-white flex items-center justify-center font-bold text-xs shadow-inner">${escapeHTML(uName.charAt(0).toUpperCase())}</div>
                                    <div><p class="font-bold text-sm ${isMe ? 'text-indigo-700 dark:text-indigo-300' : ''}">${escapeHTML(uName)} ${isMe ? '(You)' : ''}</p><p class="text-[10px] uppercase font-bold text-slate-500">Lvl ${u.level}</p></div>
                                </div>
                                <div class="text-right"><p class="font-black text-emerald-500">${u.xp}</p><p class="text-[9px] uppercase font-bold text-slate-400">XP</p></div>
                            </div>`;
                        }).join('')}
                    </div>
                </div>`;
            }

            let badgesHTML = '';
            if (state.badges && state.badges.length > 0) {
                badgesHTML = `<div class="glass-panel p-6 rounded-[2rem] shadow-sm mt-6 text-left"><h4 class="font-black text-indigo-600 dark:text-indigo-400 mb-4">🏆 මගේ පදක්කම්</h4><div class="flex flex-wrap gap-4 justify-center">${state.badges.map(b => `<div class="flex flex-col items-center bg-slate-100 dark:bg-slate-800 p-3 rounded-2xl w-24 text-center border border-slate-200 dark:border-slate-700 shadow-sm" title="${badgeDict[b]?.d || ''}"><span class="text-3xl mb-2 drop-shadow-sm">${badgeDict[b]?.i || '🎖️'}</span><span class="text-[10px] font-black text-slate-700 dark:text-slate-300 tracking-tight leading-tight">${badgeDict[b]?.n || 'Badge'}</span></div>`).join('')}</div></div>`;
            }

            return `<div class="max-w-2xl mx-auto space-y-8 pb-20">
                <header class="text-center"><h2 class="text-4xl font-black drop-shadow-md">${t('profile')}</h2></header>
                
                ${leaderboardHTML}

                <div class="glass-panel p-8 md:p-10 rounded-[3rem] shadow-sm text-center relative">
                    <div onclick="window.changeAvatar()" class="w-28 h-28 bg-gradient-to-tr from-indigo-500 to-purple-500 rounded-full flex items-center justify-center mx-auto mb-4 shadow-xl text-5xl text-white font-black cursor-pointer hover:scale-110 transition-transform" title="Click to change Avatar" aria-label="Change Avatar">${escapeHTML(state.user.avatar || '👤')}</div>
                    <h3 class="text-3xl font-black mb-1 flex justify-center items-center gap-2">
                        <span>${escapeHTML(userName)}</span>
                        <button onclick="window.editName()" class="text-lg text-slate-400 hover:text-indigo-500 transition-colors" title="Edit Name" aria-label="Edit Name">✏️</button>
                    </h3>
                    <p class="text-slate-500 font-bold mb-6">${escapeHTML(state.user.email)}</p>
                    
                    ${trialHTML}

                    <div class="flex justify-center space-x-8 border-t border-slate-300 dark:border-slate-700 pt-6">
                        <div><p class="text-2xl font-black text-indigo-500">${state.user.level}</p><p class="text-[10px] uppercase font-bold text-indigo-400 mt-1 break-words w-24">${getLevelName(state.user.level)}</p></div>
                        <div><p class="text-2xl font-black text-emerald-500">${state.user.xp}</p><p class="text-[10px] uppercase font-bold text-slate-500 mt-1">XP</p></div>
                        <div><p class="text-2xl font-black text-orange-500">${escapeHTML(state.user.joined)}</p><p class="text-[10px] uppercase font-bold text-slate-500 mt-1">Joined</p></div>
                    </div>

                    ${badgesHTML}
                </div>

                <div class="glass-panel p-8 md:p-10 rounded-[3rem] space-y-6 shadow-sm text-center">
                    <h3 class="text-xl font-black mb-2 text-slate-700 dark:text-slate-200">${t('feedback_title')}</h3>
                    <div class="flex justify-center space-x-2 text-3xl mb-4">
                        ${[1,2,3,4,5].map(i => `<button onclick="window.setRating(${i})" aria-label="Rate ${i} Stars" class="${(state.appRating||0) >= i ? '' : 'grayscale opacity-30'} hover:scale-110 transition-transform drop-shadow-md">⭐</button>`).join('')}
                    </div>
                    <textarea id="feedback-text" aria-label="Feedback Text" placeholder="${t('feedback_ph')}" class="w-full p-4 glass-btn rounded-xl outline-none focus:border-indigo-500 font-medium h-24"></textarea>
                    <button onclick="window.submitFeedback()" class="w-full bg-indigo-600 text-white px-6 py-3 rounded-xl font-black shadow-lg hover:bg-indigo-500 transition-colors">${t('send_btn')}</button>
                </div>
                
                ${isAdmin() ? `<div class="p-6 bg-slate-900/80 backdrop-blur-md rounded-3xl border border-slate-700 mb-6 text-white shadow-2xl"><h3 class="text-2xl font-black text-indigo-400 mb-4">${t('admin_core')}</h3><p class="text-sm opacity-80 mb-6">Publish articles to all users instantly.</p>
                <div class="flex gap-2 mb-3">
                    <input type="text" id="admin-art-author" aria-label="Author" placeholder="Author" class="w-1/3 p-3 bg-slate-950 rounded-xl outline-none font-bold border border-slate-800 text-sm"/>
                    <input type="text" id="admin-art-cat" aria-label="Category" placeholder="Category" class="w-1/3 p-3 bg-slate-950 rounded-xl outline-none font-bold border border-slate-800 text-sm"/>
                    <input type="text" id="admin-art-time" aria-label="Read Time" placeholder="Read Time (e.g. 5m)" class="w-1/3 p-3 bg-slate-950 rounded-xl outline-none font-bold border border-slate-800 text-sm"/>
                </div>
                <input type="text" id="admin-art-title" aria-label="Article Title" placeholder="Title" class="w-full p-4 bg-slate-950 rounded-xl outline-none mb-3 font-bold border border-slate-800"/><textarea id="admin-art-intro" aria-label="Article Intro" placeholder="Intro..." class="w-full p-4 bg-slate-950 rounded-xl outline-none mb-3 h-20 border border-slate-800"></textarea><textarea id="admin-art-text" aria-label="Article Content" placeholder="Content..." class="w-full p-4 bg-slate-950 rounded-xl outline-none mb-4 h-32 border border-slate-800"></textarea><button id="publish-btn" onclick="window.publishAdminArticle()" class="w-full bg-indigo-600 hover:bg-indigo-500 py-4 rounded-xl font-black shadow-lg">Publish Global Article</button></div>` : ''}

                <div class="mt-4">
                    <label for="target-date-input" class="font-black text-sm block mb-2 mt-4 text-slate-700 dark:text-slate-300">${t('target_date')}</label>
                    <input type="date" id="target-date-input" value="${escapeHTML(state.user.targetDate)}" onchange="window.updateTargetDate(this.value)" class="w-full px-4 py-3 glass-btn rounded-xl outline-none mb-4 font-bold text-slate-700 dark:text-slate-200" />
                </div>
                <div>
                    <button onclick="window.addCustomCategory()" class="w-full py-4 border-2 border-indigo-200 dark:border-indigo-900 text-indigo-600 dark:text-indigo-400 font-black rounded-2xl hover:bg-indigo-50 dark:hover:bg-indigo-900/30 hover:scale-[1.02] transition-transform">${t('add_category')}</button>
                </div>

                <div class="pt-6 space-y-4 border-t border-slate-300 dark:border-slate-700">
                    <button onclick="window.exportDataPDF()" class="w-full py-4 glass-btn font-black rounded-2xl shadow-sm text-indigo-600 dark:text-indigo-400 hover:bg-indigo-50 dark:hover:bg-indigo-900/30 hover:scale-[1.02] transition-transform">${t('export_pdf')}</button>
                    <button onclick="window.clearAllData()" class="w-full py-4 glass-btn font-black rounded-2xl shadow-sm text-slate-600 dark:text-slate-300 hover:bg-slate-200/50 dark:hover:bg-slate-800/50 hover:scale-[1.02] transition-transform">${t('clear_all')}</button>
                    <button onclick="window.logout()" class="w-full py-4 glass-btn font-black rounded-2xl shadow-sm text-rose-500 hover:scale-[1.02] transition-transform">${t('logout')}</button>
                    <button onclick="window.deleteAccount()" class="w-full py-4 border-2 border-red-200 text-red-500 font-black rounded-2xl hover:bg-red-50 dark:hover:bg-red-900/20 hover:scale-[1.02] transition-transform">${t('del_acc')}</button>
                </div></div></div>`;
        }

        function initApp() {
            fetchTodayHoliday();
            setInterval(checkNewDay, 60000);
        }

        initApp();
    </script>
</body>
</html>
