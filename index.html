<!DOCTYPE html>
<html lang="si" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindsetOS - Ultimate Scientific Framework</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { darkbg: '#0f172a', darkcard: '#1e293b' } } }
        }
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Noto+Sans+Sinhala:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root { --font-main: 'Inter', 'Noto Sans Sinhala', sans-serif; }
        body { font-family: var(--font-main); scroll-behavior: smooth; }
       .animate-fade-in { animation: fadeIn 0.5s ease-out forwards; }
       .animate-slide-up { animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
       .glass-nav { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(16px); }
       .dark.glass-nav { background: rgba(30, 41, 59, 0.85); border-right: 1px solid rgba(51, 65, 85, 0.8); }
       .card-hover:hover { transform: translateY(-5px); box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
       .dark ::-webkit-scrollbar-thumb { background: #475569; }
       .timer-circle { border-radius: 50%; }
       .perspective { perspective: 1000px; }
       .preserve-3d { transform-style: preserve-3d; transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1); }
       .backface-hidden { backface-visibility: hidden; }
       .rotate-y-180 { transform: rotateY(180deg); }
       .chart-container { position: relative; width: 100%; max-width: 800px; margin-left: auto; margin-right: auto; height: 300px; max-height: 400px; }
        @media print {
            body { background: white!important; color: black!important; }
           .print-hidden { display: none!important; }
           .print-content { padding: 0!important; margin: 0!important; max-width: 100%!important; }
           .print-text-black { color: black!important; }
           .print-border-light { border-color: #e2e8f0!important; }
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-darkbg text-slate-900 dark:text-slate-100 overflow-x-hidden transition-colors duration-300 print:bg-white">

    <div id="app-root"></div>
    <div id="toast-container" class="fixed top-24 right-6 z-50 flex flex-col space-y-2 pointer-events-none print-hidden"></div>
    <div id="modal-container" class="fixed inset-0 z- hidden items-center justify-center bg-slate-900/60 backdrop-blur-sm print-hidden transition-opacity"></div>

    <script>
        const appId = "mindset-os-secure-v2";
        const GOOGLE_SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQFbQGRAZ0-oVmelxStjuVQKVT7QcXvyp8udwNdDhWRwBUPa5a9Qyh7i0IEufIZ5ODi8owLHhXszqkW/pub?output=csv";

        let state = {
            activeTab: 'home',
            selectedArticleId: null,
            flippedCards: {},
            isNewUser: true,
            user: { name: '', email: '', password: '', joined: '', targetDate: '', theme: 'light', xp: 0, level: 1 },
            habits:, history:, reflections: {}, moods: {}, flashcards:,
            stats: { totalFocusMinutes: 0 }, streak: { count: 0, lastDate: null },
            categories: {
                'Study': { name: 'අධ්‍යාපනය', color: 'bg-blue-100 text-blue-700 dark:bg-blue-900/50 dark:text-blue-300 border-blue-200 dark:border-blue-800' },
                'Health': { name: 'සෞඛ්‍යය', color: 'bg-green-100 text-green-700 dark:bg-green-900/50 dark:text-green-300 border-green-200 dark:border-green-800' },
                'Work': { name: 'ව්‍යාපාර', color: 'bg-orange-100 text-orange-700 dark:bg-orange-900/50 dark:text-orange-300 border-orange-200 dark:border-orange-800' },
                'Other': { name: 'වෙනත්', color: 'bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-300 border-slate-200 dark:border-slate-700' }
            }
        };

        const priorities = {
            'Q1': { name: 'හදිසි + වැදගත්', class: 'bg-red-50 text-red-600 dark:bg-red-900/20 dark:text-red-400' },
            'Q2': { name: 'වැදගත් පමණි', class: 'bg-indigo-50 text-indigo-600 dark:bg-indigo-900/20 dark:text-indigo-400' },
            'Q3': { name: 'හදිසි පමණි', class: 'bg-yellow-50 text-yellow-600 dark:bg-yellow-900/20 dark:text-yellow-400' },
            'Q4': { name: 'සාමාන්‍ය', class: 'bg-slate-50 text-slate-600 dark:bg-slate-800 dark:text-slate-400' }
        };

        const moodEmojis = { 'great': '🤩', 'good': '😊', 'neutral': '😐', 'bad': '😫' };
        let timerState = { mode: 'focus', timeLeft: 25 * 60, isRunning: false, interval: null, lockFocus: false };
        let progressChartInstance = null;

        let articles =, science: "Loading..." }
        ];

        // Security check for Admin Panel
        function checkAdmin() {
            const _e = .map(c=>String.fromCharCode(c)).join('');
            const _p = .map(c=>String.fromCharCode(c)).join('');
            return state.user.email === _e && state.user.password === _p;
        }

        function escapeHTML(str) { return str? str.replace(/[&<>'"]/g, tag => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'}[tag])) : ''; }

        function showToast(msg, type='info') {
            const container = document.getElementById('toast-container');
            const el = document.createElement('div');
            let bgClass = type === 'success'? 'bg-green-500' : type === 'error'? 'bg-red-500' : 'bg-indigo-600';
            el.className = `px-6 py-3 rounded-2xl font-bold shadow-lg animate-slide-up text-white ${bgClass}`;
            el.innerHTML = msg; container.appendChild(el);
            setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 300); }, 3000);
        }

        function showConfirmModal(message, onConfirm) {
            const container = document.getElementById('modal-container');
            container.innerHTML = `
                <div class="bg-white dark:bg-darkcard p-8 rounded-[2rem] shadow-2xl max-w-sm w-full mx-4 animate-slide-up border border-slate-200 dark:border-slate-700">
                    <h3 class="text-xl font-black mb-4 text-slate-900 dark:text-white">තහවුරු කරන්න</h3>
                    <p class="text-slate-600 dark:text-slate-300 mb-8">${message}</p>
                    <div class="flex space-x-4">
                        <button id="modal-cancel" class="flex-1 py-3 bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 font-bold rounded-xl hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors">අවලංගු කරන්න</button>
                        <button id="modal-confirm" class="flex-1 py-3 bg-red-600 text-white font-bold rounded-xl hover:bg-red-700 transition-colors">තහවුරුයි</button>
                    </div>
                </div>
            `;
            container.classList.remove('hidden'); container.classList.add('flex');
            document.getElementById('modal-cancel').onclick = () => { container.classList.add('hidden'); container.classList.remove('flex'); };
            document.getElementById('modal-confirm').onclick = () => { container.classList.add('hidden'); container.classList.remove('flex'); onConfirm(); };
        }

        function showPromptModal(message, onConfirm) {
            const container = document.getElementById('modal-container');
            container.innerHTML = `
                <div class="bg-white dark:bg-darkcard p-8 rounded-[2rem] shadow-2xl max-w-sm w-full mx-4 animate-slide-up border border-slate-200 dark:border-slate-700">
                    <h3 class="text-xl font-black mb-4 text-slate-900 dark:text-white">${message}</h3>
                    <input type="text" id="modal-input" class="w-full px-4 py-3 mb-8 bg-slate-50 dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 outline-none font-bold text-slate-800 dark:text-white"/>
                    <div class="flex space-x-4">
                        <button id="modal-cancel" class="flex-1 py-3 bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 font-bold rounded-xl hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors">අවලංගු කරන්න</button>
                        <button id="modal-confirm" class="flex-1 py-3 bg-indigo-600 text-white font-bold rounded-xl hover:bg-indigo-700 transition-colors">එක් කරන්න</button>
                    </div>
                </div>
            `;
            container.classList.remove('hidden'); container.classList.add('flex');
            document.getElementById('modal-cancel').onclick = () => { container.classList.add('hidden'); container.classList.remove('flex'); };
            document.getElementById('modal-confirm').onclick = () => {
                const val = document.getElementById('modal-input').value;
                container.classList.add('hidden'); container.classList.remove('flex');
                onConfirm(val);
            };
        }

        async function fetchArticlesFromSheet() {
            let globalArticles = JSON.parse(localStorage.getItem('mindsetos-global-articles') |

| '');
            
            try {
                const response = await fetch(GOOGLE_SHEET_CSV_URL + "&t=" + new Date().getTime(), { cache: 'no-store' });
                const csvData = await response.text();
                Papa.parse(csvData, {
                    header: true, skipEmptyLines: true,
                    complete: function(results) {
                        const fetchedArticles = results.data.map(row => {
                            let sections =;
                            if(row.Sec1Title && row.Sec1Text) sections.push({title: row.Sec1Title, text: row.Sec1Text});
                            if(row.Sec2Title && row.Sec2Text) sections.push({title: row.Sec2Title, text: row.Sec2Text});
                            if(row.Sec3Title && row.Sec3Text) sections.push({title: row.Sec3Title, text: row.Sec3Text});
                            return {
                                id: row.ID, title: row.Title, author: row.Author, category: row.Category,
                                icon: row.Icon |

| '📚', color: row.Color |
| 'text-indigo-500',
                                readTime: row.ReadTime |

| 'විනාඩි 5', excerpt: row.Excerpt, intro: row.Intro,
                                sections: sections, science: row.Science
                            };
                        }).filter(a => a.id && a.title);

                        articles = [...globalArticles,...fetchedArticles];
                        if(state.activeTab === 'library' |

| state.selectedArticleId) render();
                    }
                });
            } catch (error) {
                console.error("දත්ත ලබාගැනීමේ දෝෂයකි:", error);
                articles =, science: "" }];
                if(state.activeTab === 'library') render();
            }
        }

        function initApp() {
            const saved = localStorage.getItem(appId);
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    if (parsed.user && parsed.user.name) {
                        state = {...state,...parsed, isNewUser: false };
                        if(!state.categories) state.categories = {};
                    }
                } catch(e) { console.error("Stored data parsing error", e); }
            }
            checkNewDay();
            applyTheme();
            fetchArticlesFromSheet();
            render();
        }

        function checkNewDay() {
            if (state.isNewUser) return;
            const today = new Date().toLocaleDateString('si-LK');
            if (!state.streak.lastDate) { state.streak.lastDate = today; updateHistory(); } 
            else if (state.streak.lastDate!== today) {
                const yest = new Date(); yest.setDate(yest.getDate() - 1);
                if (state.streak.lastDate!== yest.toLocaleDateString('si-LK')) state.streak.count = 0; 
                state.habits = state.habits.map(h => ({...h, completed: false }));
                state.streak.lastDate = today;
                updateHistory(); saveData();
            }
        }

        function saveData() { if (!state.isNewUser) localStorage.setItem(appId, JSON.stringify(state)); }

        function exportData() {
            const dataStr = localStorage.getItem(appId);
            if (!dataStr) return showToast("දත්ත කිසිවක් නොමැත!", "error");
            const blob = new Blob(, { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `MindsetOS_Backup_${new Date().toISOString().split('T')}.json`;
            a.click();
            URL.revokeObjectURL(url);
            showToast("Backup ගොනුව සාර්ථකව Download විය.", "success");
        }
        
        function importData(event) {
            const file = event.target.files;
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    if (data && data.user) {
                        localStorage.setItem(appId, JSON.stringify(data));
                        showToast("දත්ත සාර්ථකව Restore කරන ලදී! පද්ධතිය නැවත ආරම්භ වේ.", "success");
                        setTimeout(() => location.reload(), 2000);
                    } else showToast("මෙය නිවැරදි Backup ගොනුවක් නොවේ!", "error");
                } catch (err) { showToast("ගොනුව කියවීමේ දෝෂයකි!", "error"); }
            };
            reader.readAsText(file);
        }

        function addXP(amount) {
            state.user.xp += amount;
            if (state.user.xp >= state.user.level * 100) {
                state.user.xp -= state.user.level * 100; state.user.level++;
                showToast(`🎉 Level Up! ඔබ දැන් Level ${state.user.level} යි.`, 'success');
            } else showToast(`+${amount} XP ලබා ගත්තා!`);
            saveData(); render();
        }

        function applyTheme() {
            if (state.user.theme === 'dark') document.documentElement.classList.add('dark');
            else document.documentElement.classList.remove('dark');
        }
        function toggleTheme() { state.user.theme = state.user.theme === 'dark'? 'light' : 'dark'; applyTheme(); saveData(); render(); }
        
        function handleStart() { 
            const n = document.getElementById('init-name')?.value.trim(); 
            const e = document.getElementById('init-email')?.value.trim(); 
            const p = document.getElementById('init-password')?.value; 
            const d = document.getElementById('init-date')?.value;
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            
            if(!n) return showToast("කරුණාකර ඔබගේ නම ඇතුළත් කරන්න.", "error");
            if(!e ||!emailRegex.test(e)) return showToast("කරුණාකර නිවැරදි ඊමේල් ලිපිනයක් ඇතුළත් කරන්න.", "error");
            if(!p |

| p.length < 6) return showToast("කරුණාකර අවම වශයෙන් අකුරු හෝ ඉලක්කම් 6 කින් යුත් මුරපදයක් ඇතුළත් කරන්න.", "error");
            
            state.user.name = n; state.user.email = e; state.user.password = p; state.user.targetDate = d; 
            state.user.joined = new Date().toLocaleDateString('si-LK'); state.isNewUser = false; 

            let allUsers = JSON.parse(localStorage.getItem('mindsetos-backend-users') |

| '');
            if(!allUsers.includes(e)) {
                allUsers.push(e);
                localStorage.setItem('mindsetos-backend-users', JSON.stringify(allUsers));
            }

            saveData(); render(); 
        }
        
        function switchTab(t) { state.activeTab = t; state.selectedArticleId = null; render(); }
        function viewArticle(id) { state.selectedArticleId = id; state.activeTab = 'library'; addXP(5); render(); }

        // --- ADMIN PUBLISHING LOGIC ---
        function publishAdminArticle() {
            const title = document.getElementById('admin-art-title')?.value;
            const author = document.getElementById('admin-art-author')?.value |

| 'MindsetOS Admin';
            const readTime = document.getElementById('admin-art-time')?.value |

| 'විනාඩි 5';
            const cat = document.getElementById('admin-art-cat')?.value |

| 'General';
            const intro = document.getElementById('admin-art-intro')?.value |

| '';
            const text = document.getElementById('admin-art-text')?.value |

| '';

            if(!title ||!intro ||!text) {
                showToast("කරුණාකර මාතෘකාව, හැඳින්වීම සහ අන්තර්ගතය ඇතුළත් කරන්න.", "error");
                return;
            }

            const newArt = {
                id: 'global-custom-' + Date.now(),
                title: title, author: author, category: cat, icon: '⭐', color: 'text-yellow-500',
                readTime: readTime, excerpt: intro.substring(0, 100) + '...', intro: intro,
                sections: [{ title: '1. අන්තර්ගතය', text: text }], science: 'Admin විසින් පද්ධතියට එක් කරන ලදී.'
            };

            // Save to Global Storage
            let globalArticles = JSON.parse(localStorage.getItem('mindsetos-global-articles') |

| '');
            globalArticles.unshift(newArt);
            localStorage.setItem('mindsetos-global-articles', JSON.stringify(globalArticles));
            
            // Add to current UI memory
            articles.unshift(newArt);
            
            document.getElementById('admin-art-title').value = '';
            document.getElementById('admin-art-intro').value = '';
            document.getElementById('admin-art-text').value = '';
            
            showToast("ලිපිය සාර්ථකව පුස්තකාලයට එක් කරන ලදී!", "success");
            render();
        }

        // Habit Stacking Integration
        function addHabit() {
            const anchor = document.getElementById('habit-anchor')?.value.trim();
            const text = document.getElementById('habit-text')?.value.trim();
            const cat = document.getElementById('habit-cat')?.value;
            const pri = document.getElementById('habit-priority')?.value;
            
            let finalStr = text;
            if(anchor && text) finalStr = `${anchor} ට පසු, මම ${text} කරමි.`;
            else if(!text && anchor) finalStr = anchor;

            if (finalStr) { 
                state.habits.unshift({ id: Date.now(), text: escapeHTML(finalStr), category: cat, priority: pri, completed: false }); 
                updateHistory(); render(); 
            }
        }
        function toggleHabit(id) {
            let newlyCompleted = false;
            state.habits = state.habits.map(h => { if(h.id === id) { if(!h.completed) newlyCompleted = true; return {...h, completed:!h.completed }; } return h; });
            if(newlyCompleted) { updateStreak(); addXP(10); }
            updateHistory(); render();
        }
        function deleteHabit(id) { state.habits = state.habits.filter(h => h.id!== id); updateHistory(); render(); }
        
        function updateStreak() {
            const today = new Date().toLocaleDateString('si-LK');
            if (state.streak.lastDate!== today) {
                const yest = new Date(); yest.setDate(yest.getDate() - 1);
                if (state.streak.lastDate === yest.toLocaleDateString('si-LK')) state.streak.count++; else state.streak.count = 1;
                state.streak.lastDate = today;
            }
        }
        
        function updateHistory() {
            const today = new Date().toLocaleDateString('si-LK');
            const score = state.habits.length? Math.round((state.habits.filter(h => h.completed).length / state.habits.length) * 100) : 0;
            state.history = [...state.history.filter(d => d.date!== today), { date: today, score }].slice(-14); saveData();
        }
        
        function addCustomCategory() {
            showPromptModal("නව කාණ්ඩයේ නම ඇතුළත් කරන්න:", (catName) => {
                if (catName && catName.trim()) {
                    const id = 'Cat_' + Date.now();
                    state.categories[id] = { name: escapeHTML(catName.trim()), color: 'bg-purple-100 text-purple-700 dark:bg-purple-900/50 dark:text-purple-300 border-purple-200 dark:border-purple-800' };
                    saveData(); render(); showToast("නව කාණ්ඩය සාර්ථකව එක් කරන ලදී.", "success");
                }
            });
        }
        function updateTargetDate(val) { state.user.targetDate = val; saveData(); render(); showToast("විභාග/ඉලක්ක දිනය යාවත්කාලීන විය.", "success"); }

        function shareToWhatsApp() {
            const completedHabits = state.habits.filter(h => h.completed);
            const score = state.habits.length? Math.round((completedHabits.length / state.habits.length) * 100) : 0;

        function addFlashcard() {

            let card = state.flashcards.find(f => f.id === id);
            if(card) {
                if (quality < 3) { card.n = 0; card.interval = 1; }

                    if (card.n === 0) card.interval = 1;
                    else if (card.n === 1) card.interval = 6;
                    else card.interval = Math.ceil(card.interval * card.ef);
                    card.n++;

                card.ef = Math.max(1.3, card.ef + (0.1 - (5 - quality) * (0.08 + (5 - quality) * 0.02)));

                state.flippedCards[id] = false;

                audioCtxObj = new (window.AudioContext |

| window.webkitAudioContext)();
                const buffer = audioCtxObj.createBuffer(1, audioCtxObj.sampleRate * 2, audioCtxObj.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
                noiseSourceNode = audioCtxObj.createBufferSource(); noiseSourceNode.buffer = buffer; noiseSourceNode.loop = true;
                const filter = audioCtxObj.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.value = type === 'rain'? 400 : (type === 'forest'? 800 : 2500);

                ${a.sections.map(s=>`<div class="space-y-2"><h3 class="text-xl font-black text-indigo-600">${s.title}</h3><p class="text-lg text-slate-700 dark:text-slate-300 print-text-black">${s.text}</p></div>`).join('')}
                <div class="bg-slate-900 rounded-[2rem] p-8 text-white shadow-xl mt-8 print:bg-white print:text-black print:border-2 print-border-light print:shadow-none">
                    <div class="flex items-center space-x-3 mb-4"><span class="text-indigo-400 text-2xl">🧬</span><h4 class="text-xl font-black uppercase">විද්‍යාත්මක පදනම</h4></div>
                    <p class="text-slate-300 text-lg leading-relaxed print-text-black">${a.science}</p>
                </div>
            </div>`;
        }

        function renderStats() {
            const moodCounts = Object.values(state.moods).reduce((acc, emoji) => { acc[emoji] = (acc[emoji] |

| 0) + 1; return acc; }, {});
            return `<div class="space-y-10 pb-20"><header class="text-center"><h2 class="text-4xl font-black">Detailed Analytics</h2><p class="mt-4 text-slate-500">ඔබගේ වර්ධනය පිළිබඳ දත්ත හා සංඛ්‍යානමය විශ්ලේෂණ</p></header><div class="grid grid-cols-1 md:grid-cols-3 gap-6"><div class="bg-indigo-600 text-white p-8 rounded-[2rem] text-center shadow-lg"><h4 class="text-5xl font-black mb-2">${state.user.level}</h4><p class="font-bold uppercase tracking-widest text-xs opacity-80">දැනට පවතින Level එක</p><p class="mt-4 text-sm font-bold bg-white/20 rounded-full py-1">${state.user.xp} XP / ${state.user.level*100} XP</p></div><div class="bg-white dark:bg-darkcard p-8 rounded-[2rem] border border-slate-100 dark:border-slate-800 text-center"><h4 class="text-5xl font-black text-slate-900 dark:text-white mb-2">${Math.round(state.stats.totalFocusMinutes/60)}<span class="text-2xl text-slate-400">h</span></h4><p class="font-bold uppercase tracking-widest text-xs text-slate-500">Total Focus Time</p></div><div class="bg-white dark:bg-darkcard p-8 rounded-[2rem] border border-slate-100 dark:border-slate-800 text-center"><div class="flex justify-center space-x-2 text-3xl mb-4">${Object.keys(moodCounts).length? Object.keys(moodCounts).slice(0,3).map(m=>`<span>${moodEmojis[m]}</span>`).join('') : '➖'}</div><p class="font-bold uppercase tracking-widest text-xs text-slate-500">ප්‍රධාන මානසික මට්ටම්</p></div></div><div class="bg-white dark:bg-darkcard p-10 rounded-[3rem] border border-slate-100 dark:border-slate-800 shadow-sm"><h4 class="font-black mb-6 text-center text-slate-600 dark:text-slate-300">පසුගිය දින 14 ක ප්‍රස්ථාරය (Daily Progress Chart)</h4><div class="chart-container"><canvas id="progressChart"></canvas></div></div></div>`;
        }

        function renderSettings() {
            return `
            <div class="max-w-xl mx-auto space-y-10 pb-20">
                <header><h2 class="text-4xl font-black text-center">සැකසුම්</h2></header>
                <div class="bg-white dark:bg-darkcard p-10 rounded-[3rem] border border-slate-100 dark:border-slate-800 space-y-6">
                    <div class="p-6 bg-indigo-50 dark:bg-indigo-900/20 rounded-2xl border border-indigo-100 dark:border-indigo-800/50 mb-6">
                        <h3 class="text-xl font-black mb-2 text-indigo-900 dark:text-indigo-300">දත්ත ආරක්ෂිතව තබාගන්න</h3>
                        <p class="text-sm text-slate-600 dark:text-slate-400 mb-4">ඔබේ වැඩ සහ ප්‍රගතිය (JSON) Download කර තබාගන්න.</p>
                        <div class="flex flex-col sm:flex-row gap-3">
                            <button onclick="exportData()" class="flex-1 py-3 bg-indigo-600 text-white font-black rounded-xl hover:bg-indigo-700 flex items-center justify-center space-x-2">
                                <span class="text-lg">⬇️</span><span>Backup ගන්න</span>
                            </button>
                            <label class="flex-1 py-3 bg-white dark:bg-slate-800 text-indigo-600 dark:text-indigo-400 font-black rounded-xl border-2 border-indigo-200 dark:border-indigo-800 hover:bg-indigo-50 dark:hover:bg-indigo-900/30 flex items-center justify-center space-x-2 cursor-pointer">
                                <span class="text-lg">⬆️</span><span>Restore කරන්න</span>
                                <input type="file" accept=".json" class="hidden" onchange="importData(event)" />
                            </label>
                        </div>
                    </div>
                    <div>
                        <label class="font-black text-sm block mb-2">විභාගය/ඉලක්ක දිනය:</label>
                        <input type="date" value="${state.user.targetDate}" onchange="updateTargetDate(this.value)" class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 outline-none mb-4" />
                    </div>
                    <div>
                        <button onclick="addCustomCategory()" class="w-full py-4 border-2 border-indigo-200 dark:border-indigo-900 text-indigo-600 dark:text-indigo-400 font-black rounded-2xl hover:bg-indigo-50 dark:hover:bg-indigo-900/30">අලුත් කාණ්ඩයක් (Category) එක් කරන්න</button>
                    </div>
                    <button onclick="showConfirmModal('ඔබගේ සියලුම ලැයිස්තු හිස් කිරීමට අවශ්‍යද?', () => { localStorage.setItem(appId, JSON.stringify({user:state.user,habits:,history:,reflections:{},categories:state.categories,streak:{count:0},stats:{totalFocusMinutes:0},flashcards:,moods:{}})); location.reload(); })" class="w-full py-4 border-2 border-slate-200 dark:border-slate-700 font-black rounded-2xl mt-4">සියලුම ලැයිස්තු හිස් කරන්න</button>
                    <button onclick="showConfirmModal('ඔබගේ සියලුම දත්ත මකා දැමීමට අවශ්‍යද? මෙය නැවත ලබා ගත නොහැක.', () => { localStorage.removeItem(appId); localStorage.removeItem('mindsetos-global-articles'); location.reload(); })" class="w-full py-4 border-2 border-red-200 text-red-500 font-black rounded-2xl hover:bg-red-50 dark:hover:bg-red-900/20">සම්පූර්ණ ගිණුම මකා දමන්න</button>
                </div>
            </div>`;
        }

        initApp();
    </script>
</body>
</html>
