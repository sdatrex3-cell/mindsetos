            background-attachment: fixed;
        }

        /* Glassmorphism Styles */
        .glass-panel { background: rgba(255, 255, 255, 0.45); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border: 1px solid rgba(255, 255, 255, 0.6); box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.05); }

        .glass-btn { background: rgba(255, 255, 255, 0.5); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.6); transition: all 0.2s ease; }
        .dark .glass-btn { background: rgba(30, 41, 59, 0.5); border: 1px solid rgba(255, 255, 255, 0.1); }
        .glass-btn:hover { background: rgba(255, 255, 255, 0.8); }
        .dark .glass-btn:hover { background: rgba(51, 65, 85, 0.8); }

        .animate-fade-in { animation: fadeIn 0.5s ease-out forwards; }
        .animate-slide-up { animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        .card-hover:hover { transform: translateY(-5px); box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); }
        ::-webkit-scrollbar { width: 6px; }

        .custom-scrollbar::-webkit-scrollbar { height: 8px; width: 8px; }
        
        .timer-circle { border-radius: 50%; }
        .perspective { perspective: 1000px; }
        .preserve-3d { transform-style: preserve-3d; transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1); }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
        .chart-container { position: relative; width: 100%; max-width: 800px; margin-left: auto; margin-right: auto; height: 250px; max-height: 300px; }
        
        @media print {
            body { background: white !important; color: black !important; }

            .print-content { padding: 0 !important; margin: 0 !important; max-width: 100% !important; }
        }
    </style>
</head>

        function playAlarm() {
            try {
                if (!globalAudioCtx) {
                    globalAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (globalAudioCtx.state === 'suspended') {
                    globalAudioCtx.resume();
                }
                const playTone = (freq, startTime, duration) => {
                    const osc = globalAudioCtx.createOscillator(); const gain = globalAudioCtx.createGain();
                    osc.connect(gain); gain.connect(globalAudioCtx.destination);
                    osc.type = 'sine'; osc.frequency.setValueAtTime(freq, startTime);
                    gain.gain.setValueAtTime(1, startTime); gain.gain.exponentialRampToValueAtTime(0.01, startTime + duration);
                    osc.start(startTime); osc.stop(startTime + duration);
                };
                const now = globalAudioCtx.currentTime;

        // ==========================================
        function initApp() {
            render(); 
            // වලාකුළෙන් (Google Sheets) දත්ත වහාම ලබාගැනීමට
            fetchUsersFromGoogleSheet();

            try {
                let savedData = localStorage.getItem(USER_DATA_KEY);
                
                // පරිශීලකයාගේ දත්ත LocalStorage හි තිබේ නම්, auto-login වීමට
                if (savedData) {
                    let parsed = JSON.parse(savedData);
                    if (parsed.user && parsed.user.email) {
                        state = { ...state, ...parsed, isNewUser: false };
                        if(!state.pastTasks) state.pastTasks = {}; 
                        if(!state.dailyFocus) state.dailyFocus = {};
                        if(!state.pendingReviews) state.pendingReviews = [];
                        if(!state.readArticles) state.readArticles = []; 
                        if(!state.timerSettings) state.timerSettings = { focus: 25, break: 5 }; 
                        
                        timerState.timeLeft = (state.timerSettings.focus || 25) * 60;
                        checkNewDay(); 
                        applyTheme();
                        syncUserStatsToGoogleSheet(); 
                    }
                }
                fetchArticlesFromGoogleSheet();
            } catch(e) { console.error("Init Error:", e); } 
            finally { isAppLoading = false; render(); }
        }

        function checkNewDay() {
            if (state.isNewUser) return;
            const today = new Date().toLocaleDateString('si-LK');
            
            if (!state.streak.lastDate) { 
                state.streak.lastDate = today; 
                state.streak.count = 1; 
                updateHistory(); 
            } else if (state.streak.lastDate !== today) {
                const yest = new Date(); yest.setDate(yest.getDate() - 1);
                
                if (state.streak.lastDate === yest.toLocaleDateString('si-LK')) {
                    state.streak.count += 1; 
                } else {
                    state.streak.count = 1; 
                }
                
                const completedYesterday = state.habits.filter(h => h.completed);
                if(completedYesterday.length > 0) state.pastTasks[state.streak.lastDate] = completedYesterday;
                
                state.habits = state.habits.filter(h => !h.completed).map(h => ({ ...h, completed: false }));
                state.streak.lastDate = today; 
                updateHistory(); 
                saveData();
            }
        }

        function saveData() { 
            if (!state.isNewUser) {
                localStorage.setItem(USER_DATA_KEY, JSON.stringify(state)); 
                let registry = JSON.parse(localStorage.getItem(USERS_REGISTRY_KEY)) || {};
                registry[state.user.email] = state;
                localStorage.setItem(USERS_REGISTRY_KEY, JSON.stringify(registry));
                syncUserStatsToGoogleSheet(); 
            }
        }

        function handleRegister() { 
            const n = document.getElementById('init-name')?.value.trim(); 
            const e = document.getElementById('init-email')?.value.trim(); 
            const p = document.getElementById('init-password')?.value; 
            if(!n || !e || p.length < 6) return showToast("කරුණාකර නිවැරදි තොරතුරු ඇතුළත් කරන්න (අවම වශයෙන් මුරපදයට අකුරු 6ක් අවශ්‍යයි).", "error");
            if(!emailRegex.test(e)) return showToast("කරුණාකර නිවැරදි ඊමේල් ලිපිනයක් ඇතුළත් කරන්න.", "error");

            let registry = JSON.parse(localStorage.getItem(USERS_REGISTRY_KEY)) || {};
            if(registry[e]) return showToast("මෙම විද්‍යුත් තැපෑල දැනටමත් භාවිතයේ පවතී. කරුණාකර ලොග් වන්න.", "error");

            state = {
                language: state.language, activeTab: 'home', selectedArticleId: null, flippedCards: {}, isNewUser: false,
                user: { name: n, email: e, password: p, joined: new Date().toLocaleDateString('si-LK'), targetDate: '', theme: 'light', xp: 0, level: 1 },
                habits: [], history: [], reflections: {}, moods: {}, flashcards: [], pastTasks: {}, dailyFocus: {}, 
                stats: { totalFocusMinutes: 0 }, streak: { count: 0, lastDate: null },
                categories: { 'Study': { name: 'අධ්‍යාපනය / Study', color: 'bg-blue-100 text-blue-700 dark:bg-blue-900/50 border-blue-200 dark:border-blue-800' } },
                pendingReviews: [], appRating: 0, lastSeenArticleId: null,
                readArticles: [], timerSettings: { focus: 25, break: 5 }
            };

            saveData(); 
            syncUserStatsToGoogleSheet(true); 
            applyTheme();
            render(); 
            showToast("සාර්ථකව ලියාපදිංචි විය!", "success");
        }

        // CROSS-DEVICE LOGIN / LOCAL LOGIN
        function handleLogin() {
            const e = document.getElementById('init-email')?.value.trim(); 
            const p = document.getElementById('init-password')?.value; 
            if(!e || !p) return showToast("කරුණාකර විද්‍යුත් තැපෑල සහ මුරපදය ඇතුළත් කරන්න.", "error");
            if(!emailRegex.test(e)) return showToast("කරුණාකර නිවැරදි ඊමේල් ලිපිනයක් ඇතුළත් කරන්න.", "error");

            // 1. පරණ Local Registry එකෙන් බලන්න
            let registry = JSON.parse(localStorage.getItem(USERS_REGISTRY_KEY)) || {};
            if(registry[e] && registry[e].user.password === p) {
                loginSuccess(registry[e]);
                return;
            }

            // 2. අලුත් ඩිවයිස් එකක් නම් Google Sheet එකෙන් (Cloud) ගෙනාපු දත්ත වලින් බලන්න
            if (state.adminUsersData && state.adminUsersData.length > 0) {
                const cloudUser = state.adminUsersData.find(u => u.email === e);
                if (cloudUser && cloudUser.password === p) {
                    if (cloudUser.stateData) {
                        try {
                            const parsedState = JSON.parse(cloudUser.stateData);
                            loginSuccess(parsedState);
                            return;
                        } catch(err) {
                            console.error("Cloud data parsing error:", err);
                        }
                    }
                }
            }

            showToast("විද්‍යුත් තැපෑල හෝ මුරපදය වැරදියි. (අන්තර්ජාලය හා සම්බන්ධ වී ඇත්දැයි බලන්න)", "error");
        }

        function loginSuccess(userData) {
            state = { ...state, ...userData, isNewUser: false };
            if(!state.pendingReviews) state.pendingReviews = [];
            if(!state.readArticles) state.readArticles = [];
            if(!state.timerSettings) state.timerSettings = { focus: 25, break: 5 };
            timerState.timeLeft = (state.timerSettings.focus || 25) * 60;
            saveData(); 
            applyTheme(); 
            render(); 
            showToast("සාර්ථකව ලොග් විය!", "success");
        }

        function handleForgotPassword() {
            showPromptModal("ඔබගේ විද්‍යුත් තැපෑල (Email) ඇතුළත් කරන්න:", (email) => {
                const e = email.trim();
                if (!e || !emailRegex.test(e)) return showToast("කරුණාකර නිවැරදි ඊමේල් ලිපිනයක් ඇතුළත් කරන්න.", "error");
                let registry = JSON.parse(localStorage.getItem(USERS_REGISTRY_KEY)) || {};
                if (!registry[e]) {
                    return showToast("මෙම විද්‍යුත් තැපෑලට අදාළ ගිණුමක් නොමැත.", "error");
                }
                
                setTimeout(() => {
                    showPromptModal("නව මුරපදය ඇතුළත් කරන්න:", (newPass) => {
                        if (!newPass || newPass.length < 6) return showToast("අවම වශයෙන් අකුරු 6ක් අවශ්‍යයි.", "error");
                        registry[e].user.password = newPass;
                        localStorage.setItem(USERS_REGISTRY_KEY, JSON.stringify(registry));
                        showToast("මුරපදය යාවත්කාලීන කරන ලදී. කරුණාකර ලොග් වන්න.", "success");
                    });
                }, 300);
            });
        }

        function switchAuthMode() { window.authMode = window.authMode === 'login' ? 'register' : 'login'; render(); }
        function logout() { localStorage.removeItem(USER_DATA_KEY); state.isNewUser = true; window.authMode = 'login'; render(); }

        // ==========================================
        // 6. GOOGLE SHEETS
        // ==========================================
        async function fetchArticlesFromGoogleSheet() {
            if (!GOOGLE_SHEET_ARTICLES_CSV_URL || GOOGLE_SHEET_ARTICLES_CSV_URL.includes("YOUR_")) return;
            try {
                const response = await fetch(GOOGLE_SHEET_ARTICLES_CSV_URL + "&t=" + Date.now(), { cache: 'no-store' });
                const csvData = await response.text();
                Papa.parse(csvData, { header: true, skipEmptyLines: true, complete: function(results) {
                        const fetchedArticles = results.data.map(row => ({ id: row.ID, title: row.Title, author: row.Author || 'MindsetOS', category: row.Category || 'General', icon: row.Icon || '📚', color: row.Color || 'text-indigo-500', readTime: row.ReadTime || '5m', excerpt: row.Excerpt, intro: row.Intro, sections: [{title: row.Sec1Title || 'අන්තර්ගතය', text: row.Sec1Text || ''}], science: row.Science || '' })).filter(a => a.id && a.title);
                        if(fetchedArticles.length > 0) { articles = [...fetchedArticles, ...defaultArticles]; if(state.activeTab === 'library' || state.activeTab === 'home' || state.selectedArticleId) render(); }
                    } });
            } catch (error) { console.error(error); }
        }

        async function fetchUsersFromGoogleSheet() {
            // වෙනස්කම: දැන් හැමෝටම දත්ත ලබාගත හැක (ලොගින් වීමට අවශ්‍ය නිසා)
            if (!GOOGLE_SHEET_USERS_CSV_URL || GOOGLE_SHEET_USERS_CSV_URL.includes("YOUR_")) return;
            try {
                const response = await fetch(GOOGLE_SHEET_USERS_CSV_URL + "&t=" + Date.now(), { cache: 'no-store' });
                const csvData = await response.text();
                Papa.parse(csvData, { header: true, skipEmptyLines: true, complete: function(results) {
                        state.adminUsersData = results.data.map(row => ({ 
                            name: row.Name, email: row.Email, password: row.Password, level: row.Level, xp: row.XP, 
                            totalFocusMinutes: row.FocusMinutes, joined: row.JoinedDate, stateData: row.StateJSON 
                        })).filter(u => u.email);
                        state.adminUsersData.sort((a,b) => (parseInt(b.xp) || 0) - (parseInt(a.xp) || 0));
                        if(state.activeTab === 'profile' && isAdmin()) render();
                    } });
            } catch (error) { console.error(error); }
        }

        function syncUserStatsToGoogleSheet(force = false) {
            // අලුතින් State එක සම්පූර්ණයෙන්ම යවයි
            if (!GOOGLE_SCRIPT_URL || GOOGLE_SCRIPT_URL.includes("YOUR_") || (state.isNewUser && !force)) return;
            const formData = new URLSearchParams();
            formData.append('action', 'saveUser'); 
            formData.append('name', state.user.name); 
            formData.append('email', state.user.email); 
            formData.append('password', state.user.password);
            formData.append('level', state.user.level); 
            formData.append('xp', state.user.xp); 
            formData.append('focusMinutes', state.stats.totalFocusMinutes || 0); 
            formData.append('joinedDate', state.user.joined);
            formData.append('stateData', JSON.stringify(state)); // සම්පූර්ණ දත්ත මෙතැනින් යවයි
            
            fetch(GOOGLE_SCRIPT_URL, { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: formData.toString(), mode: 'no-cors' }).catch(e=>e);
        }

        function publishAdminArticle() {
            const title = document.getElementById('admin-art-title')?.value; const intro = document.getElementById('admin-art-intro')?.value; const text = document.getElementById('admin-art-text')?.value;
            
            if(!GOOGLE_SCRIPT_URL || GOOGLE_SCRIPT_URL.includes("YOUR_")) {
                return showToast("කරුණාකර ඔබගේ Google Script URL එක කේතයට එක් කරන්න.", "error");
            }
            if(!title || !intro || !text) return showToast("කරුණාකර සියලු විස්තර පුරවන්න.", "error");
            
            const newArtID = 'art-' + Date.now();
            const formData = new URLSearchParams();
            formData.append('action', 'saveArticle'); formData.append('ID', newArtID); formData.append('Title', title); formData.append('Author', document.getElementById('admin-art-author')?.value || 'Admin'); formData.append('Category', document.getElementById('admin-art-cat')?.value || 'General'); formData.append('Icon', '⭐'); formData.append('Color', 'text-yellow-500'); formData.append('ReadTime', document.getElementById('admin-art-time')?.value || '5m'); formData.append('Excerpt', intro.substring(0, 100) + '...'); formData.append('Intro', intro); formData.append('Sec1Title', 'අන්තර්ගතය'); formData.append('Sec1Text', text); formData.append('Science', 'Admin Data');
            
            fetch(GOOGLE_SCRIPT_URL, { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: formData.toString(), mode: 'no-cors' })
            .then(() => { showToast("ලිපිය ප්‍රකාශයට පත් කළා! Google Sheet යාවත්කාලීන වනු ඇත.", "success"); setTimeout(fetchArticlesFromGoogleSheet, 2000); })
            .catch(e => showToast("ජාලයේ දෝෂයක් (Network Error)", "error"));
        }

        function deleteAdminArticle(articleId) {
            showConfirmModal("මෙම ලිපිය සම්පූර්ණයෙන්ම ඉවත් කිරීමට ඔබට අවශ්‍යද?", () => {
                articles = articles.filter(a => a.id !== articleId); render();
                showToast("ලිපිය ඉවත් කරන ලදී.", "success");
                if(GOOGLE_SCRIPT_URL && !GOOGLE_SCRIPT_URL.includes("YOUR_")) {
                    const formData = new URLSearchParams();
                    formData.append('action', 'deleteArticle'); formData.append('ID', articleId);
                    fetch(GOOGLE_SCRIPT_URL, { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: formData.toString(), mode: 'no-cors' }).catch(e=>e);

        // ==========================================
        // 7. FEATURES & TIMER
        // ==========================================
        function addHabit() {
            const inputEl = document.getElementById('habit-text');
            const timeEl = document.getElementById('habit-time');
            const reviewEl = document.getElementById('habit-review');
            const text = inputEl?.value.trim();
            const time = timeEl?.value;
            const needsReview = reviewEl?.checked;
            const cat = document.getElementById('habit-cat')?.value;
            const pri = document.getElementById('habit-priority')?.value;
            
            if (text) { 
                state.habits.unshift({ id: Date.now(), text: escapeHTML(text), time: time, needsReview: needsReview, category: cat, priority: pri, completed: false, date: new Date().toLocaleDateString('si-LK') }); 
                updateHistory(); 
                if(inputEl) inputEl.value = ''; 
                if(timeEl) timeEl.value = '';
                if(reviewEl) reviewEl.checked = false;
                render(); 
                setTimeout(() => document.getElementById('habit-text')?.focus(), 50); // Auto focus back for quick adding
                showToast("කාර්යය ඇතුළත් කරන ලදී", "success");
            } else {
                showToast("කරුණාකර කාර්යයක් ඇතුළත් කරන්න", "error");
            }
        }
        
        function toggleHabit(id) {
            let newlyCompleted = false;
            state.habits = state.habits.map(h => { 
                if(h.id === id) { 
                    if(!h.completed) {
                        newlyCompleted = true;
                        if(h.needsReview) {
                            if(!state.pendingReviews) state.pendingReviews = [];
                            const exists = state.pendingReviews.some(pr => pr.text === h.text);
                            if (!exists) {
                                const rd = new Date(); rd.setHours(0,0,0,0); rd.setDate(rd.getDate() + 3);
                                state.pendingReviews.push({ id: Date.now(), text: h.text, reviewTimestamp: rd.getTime() });
                            }
                        }
                    }
                    return { ...h, completed: !h.completed }; 
                } 
                return h; 
            });
            if(newlyCompleted) addXP(10);
            updateHistory(); render();
        }

        function dismissReview(id) {
            if(state.pendingReviews) {
                state.pendingReviews = state.pendingReviews.filter(r => r.id !== id);
                saveData(); render();
            }
        }

        function deleteHabit(id) { state.habits = state.habits.filter(h => h.id !== id); updateHistory(); render(); }
        
        function updateHistory() {
            const today = new Date().toLocaleDateString('si-LK');
            const score = state.habits.length ? Math.round((state.habits.filter(h => h.completed).length / state.habits.length) * 100) : 0;
            state.history = [...state.history.filter(d => d.date !== today), { date: today, score }].slice(-14); saveData();
        }
        
        function saveJournal() { state.reflections[new Date().toLocaleDateString('si-LK')] = escapeHTML(document.getElementById('journal-text')?.value); saveData(); showToast(t('save_journal'), 'success'); render(); }
        function setMood(mood) { state.moods[new Date().toLocaleDateString('si-LK')] = mood; saveData(); render(); }

        function addFlashcard() { 
            const qEl = document.getElementById('fc-q');
            const aEl = document.getElementById('fc-a');
            const q = qEl?.value.trim(); 
            const a = aEl?.value.trim(); 
            if(q && a) { 
                state.flashcards.unshift({ id: Date.now(), q: escapeHTML(q), a: escapeHTML(a) }); 
                saveData(); 
                qEl.value = ''; 
                aEl.value = ''; 
                render(); 
                showToast("ෆ්ලෑෂ් කාඩ්පත එක් කරන ලදී", "success");
            } else {
                showToast("කරුණාකර ප්‍රශ්නය සහ පිළිතුර ඇතුළත් කරන්න.", "error");
            }
        }
        function deleteFlashcard(id) { state.flashcards = state.flashcards.filter(f => f.id !== id); saveData(); render(); }
        function flipCardDOM(id, element) { state.flippedCards[id] = !state.flippedCards[id]; element.querySelector('.preserve-3d').classList.toggle('rotate-y-180'); }

        let audioCtxObj = null; let noiseSourceNode = null;
        function toggleFocusSound() {
            if (audioCtxObj) { audioCtxObj.close(); audioCtxObj = null; noiseSourceNode = null; return; }
            try {
                audioCtxObj = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtxObj.state === 'suspended') {
                    audioCtxObj.resume();
                }
                const buffer = audioCtxObj.createBuffer(1, audioCtxObj.sampleRate * 2, audioCtxObj.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
                noiseSourceNode = audioCtxObj.createBufferSource(); noiseSourceNode.buffer = buffer; noiseSourceNode.loop = true;
                const filter = audioCtxObj.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.value = 400; 
                noiseSourceNode.connect(filter); filter.connect(audioCtxObj.destination); noiseSourceNode.start();
                showToast('අවධානය සඳහා නාදය ක්‍රියාත්මකයි', 'success');
            } catch(e) { console.log(e); }
        }

        // ADJUSTABLE POMODORO FUNCTIONS
        // ==========================================
        function updateTimerSettings(type, val) {
            let num = parseInt(val);
            if (isNaN(num) || num < 1) num = 1;
            if (!state.timerSettings) state.timerSettings = { focus: 25, break: 5 };
            state.timerSettings[type] = num;
            saveData();
            if (timerState.phase === 'idle' && type === 'focus') {
                timerState.timeLeft = num * 60;
                updateTimerUI();
            }
        }

        function toggleTimer() {
            if (!globalAudioCtx) {
                globalAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (globalAudioCtx.state === 'suspended') {
                globalAudioCtx.resume();
            }

            if (timerState.phase === 'running' || timerState.phase === 'break-running') { 
                clearInterval(timerState.interval); 
                timerState.phase = timerState.phase === 'running' ? 'paused' : 'break-paused'; 
            } else if (timerState.phase === 'paused' || timerState.phase === 'break-paused') {
                timerState.phase = timerState.phase === 'paused' ? 'running' : 'break-running';
                startTimerInterval();
            } else {
                timerState.phase = timerState.mode === 'focus' ? 'running' : 'break-running';
                startTimerInterval();
            }
            render();
        }

        function startTimerInterval() {
            clearInterval(timerState.interval);
            timerState.interval = setInterval(() => {
                if (timerState.timeLeft > 0) { 
                    timerState.timeLeft--; 
                    updateTimerUI(); 
                } else {
                    clearInterval(timerState.interval); 
                    playAlarm(); 
                    if(timerState.mode === 'focus') { 
                        let focusMins = state.timerSettings?.focus || 25;
                        addXP(focusMins); state.stats.totalFocusMinutes += focusMins; 
                        const today = new Date().toLocaleDateString('si-LK');
                        state.dailyFocus[today] = (state.dailyFocus[today] || 0) + focusMins;
                        saveData(); 
                        timerState.phase = 'focus-ended';
                        showToast("අවධානය යොමුකළ කාලය අවසන්!", "success"); 
                    } else { 
                        showToast("විවේක කාලය අවසන්!", "info"); 
                        resetTimer();
                    }
                    render();
                }
            }, 1000);
        }
        
        function resetTimer() { 
            clearInterval(timerState.interval); 
            timerState.mode = 'focus'; 
            timerState.phase = 'idle'; 
            timerState.timeLeft = (state.timerSettings?.focus || 25) * 60; 
            render(); 
        }

        function startBreakManual() {
            timerState.mode = 'break';
            timerState.timeLeft = (state.timerSettings?.break || 5) * 60;
            timerState.phase = 'break-running';
            if (!globalAudioCtx) {
                globalAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (globalAudioCtx.state === 'suspended') {
                globalAudioCtx.resume();
            }
            startTimerInterval();
            render();
        }

        function renderPlanner() {
            const today = new Date().toLocaleDateString('si-LK');
            let historyHTML = '';
            const pastDates = Object.keys(state.pastTasks).sort((a,b) => new Date(b) - new Date(a));
            if(pastDates.length > 0 || Object.keys(state.reflections).length > 1) {
                historyHTML = `<div class="mt-12 pt-8 border-t border-slate-300 dark:border-slate-700"><h3 class="text-2xl font-black mb-6 drop-shadow-sm flex items-center gap-2"><span>🕰️</span> ${t('history')}</h3><div class="space-y-6">`;
                const allDates = new Set([...pastDates, ...Object.keys(state.reflections)]);
                Array.from(allDates).sort((a,b) => new Date(b) - new Date(a)).forEach(d => {
                    if (d === today) return; 
                    historyHTML += `<div class="glass-panel p-6 rounded-3xl"><h4 class="font-bold text-indigo-600 dark:text-indigo-400 mb-3">${d}</h4>`;
                    if (state.pastTasks[d] && state.pastTasks[d].length > 0) {
                        historyHTML += `<div class="mb-3"><p class="text-xs uppercase font-bold text-slate-500 mb-2">Tasks</p><ul class="list-disc list-inside pl-4 text-sm font-medium space-y-1 opacity-80">`;
                        state.pastTasks[d].forEach(task => { historyHTML += `<li>${task.text} ${task.time ? `(${task.time})`:''}</li>`; });
                        historyHTML += `</ul></div>`;
                    }
                    if (state.reflections[d]) {
                        historyHTML += `<div><p class="text-xs uppercase font-bold text-slate-500 mb-2">Journal</p><p class="text-sm font-medium italic opacity-90 border-l-2 border-indigo-400 pl-3">${state.reflections[d]}</p></div>`;
                    }
                    historyHTML += `</div>`;
                });
                historyHTML += `</div></div>`;
            }

            return `<div class="max-w-4xl mx-auto space-y-8 pb-10">

                        </div>

        function renderTimer() {

                controlButtons = `<div class="flex justify-center space-x-4 mt-8 animate-fade-in"><button onclick="window.startBreakManual()" class="px-8 py-4 bg-emerald-500 text-white rounded-2xl font-black shadow-lg text-lg hover:bg-emerald-400">${t('start_break').replace('5m', (state.timerSettings?.break || 5) + 'm')}</button><button onclick="window.skipBreakManual()" class="px-8 py-4 glass-btn rounded-2xl font-black text-slate-500 dark:text-slate-300 transition-colors">${t('skip_break')}</button></div>`;

            return `<div class="max-w-xl mx-auto space-y-10 text-center pb-20"><header><h2 class="text-4xl font-black drop-shadow-md">${t('timer_title')}</h2></header><div class="glass-panel p-12 rounded-[3rem] relative shadow-xl"><div class="flex justify-center space-x-2 mb-8"><button onclick="window.toggleFocusSound()" class="px-4 py-2 rounded-lg text-xs font-bold border glass-btn shadow-sm">SOUND (BETA)</button></div>${settingsUI}<div class="relative w-72 h-72 mx-auto mb-10 flex items-center justify-center"><div class="absolute inset-0 bg-slate-200/50 dark:bg-slate-700/50 rounded-full shadow-inner"></div><div id="timer-circle-bg" class="absolute inset-0 timer-circle transition-all duration-500"></div><div class="absolute inset-4 glass-panel rounded-full flex flex-col items-center justify-center"><span class="text-sm font-bold text-slate-500 uppercase tracking-widest mb-1">${timerState.mode} MODE</span><span id="timer-display" class="text-7xl font-black drop-shadow-md">${String(Math.floor(timerState.timeLeft / 60)).padStart(2, '0')}:${String(timerState.timeLeft % 60).padStart(2, '0')}</span></div></div>${controlButtons}</div></div>`;

                </div>

                <div class="glass-panel p-8 md:p-10 rounded-[3rem] space-y-6 shadow-sm">
                ${adminMode ? `<div class="p-6 bg-slate-900/80 backdrop-blur-md rounded-3xl border border-slate-700 mb-6 text-white shadow-2xl"><h3 class="text-2xl font-black text-indigo-400 mb-4">Admin Core</h3><p class="text-sm opacity-80 mb-6">Check Google Sheets for raw user data.</p><input type="text" id="admin-art-title" placeholder="Title" class="w-full p-4 bg-slate-950 rounded-xl outline-none mb-3 font-bold border border-slate-800"/><textarea id="admin-art-intro" placeholder="Intro..." class="w-full p-4 bg-slate-950 rounded-xl outline-none mb-3 h-20 border border-slate-800"></textarea><textarea id="admin-art-text" placeholder="Content..." class="w-full p-4 bg-slate-950 rounded-xl outline-none mb-4 h-32 border border-slate-800"></textarea><button id="publish-btn" onclick="window.publishAdminArticle()" class="w-full bg-indigo-600 hover:bg-indigo-500 py-4 rounded-xl font-black shadow-lg">Publish Global Article</button></div>` : ''}
                
                <div class="flex flex-col sm:flex-row gap-3 mt-4">
                    <button onclick="window.exportData()" class="flex-1 py-3 bg-indigo-600 text-white font-black rounded-xl hover:bg-indigo-700 flex items-center justify-center space-x-2"><span class="text-lg">⬇️</span><span>${t('backup_data')}</span></button>
                    <label class="flex-1 py-3 glass-btn font-black rounded-xl hover:bg-slate-200 dark:hover:bg-slate-800 flex items-center justify-center space-x-2 cursor-pointer"><span class="text-lg">⬆️</span><span>${t('restore_data')}</span><input type="file" accept=".json" class="hidden" onchange="window.importData(event)" /></label>
                </div>
                
                <div class="mt-4">
                    <label class="font-black text-sm block mb-2 mt-4 text-slate-700 dark:text-slate-300">${t('target_date')}</label>
                    <input type="date" value="${state.user.targetDate}" onchange="window.updateTargetDate(this.value)" class="w-full px-4 py-3 glass-btn rounded-xl outline-none mb-4 font-bold text-slate-700 dark:text-slate-200" />
                </div>
                <div>
                    <button onclick="window.addCustomCategory()" class="w-full py-4 border-2 border-indigo-200 dark:border-indigo-900 text-indigo-600 dark:text-indigo-400 font-black rounded-2xl hover:bg-indigo-50 dark:hover:bg-indigo-900/30 transition-colors">${t('add_category')}</button>
                </div>

                <div class="pt-6 space-y-4 border-t border-slate-300 dark:border-slate-700">
                    <button onclick="window.clearAllData()" class="w-full py-4 glass-btn font-black rounded-2xl shadow-sm text-slate-600 dark:text-slate-300 hover:bg-slate-200/50 dark:hover:bg-slate-800/50 transition-colors">${t('clear_all')}</button>
                    <button onclick="window.logout()" class="w-full py-4 glass-btn font-black rounded-2xl shadow-sm text-rose-500 transition-colors">${t('logout')}</button>
                    <button onclick="window.deleteAccount()" class="w-full py-4 border-2 border-red-200 text-red-500 font-black rounded-2xl hover:bg-red-50 dark:hover:bg-red-900/20 transition-colors">${t('del_acc')}</button>
                </div></div></div>`;
        }

        initApp();
    </script>
</body>
</html>
