        function addHabit() {
            const i = document.getElementById('h-in');
            if (i.value.trim()) { habits.unshift({ id: Date.now(), text: i.value, completed: false }); i.value = ''; updateHist(); save(); render(); }
        }

        function toggleH(id) { habits = habits.map(h => h.id === id ? { ...h, completed: !h.completed } : h); updateHist(); save(); render(); }

            const today = new Date().toLocaleDateString('si-LK');

                <h2 class="text-3xl font-black">සැකසුම්</h2>
                <div class="bg-white p-10 rounded-[2.5rem] border border-slate-100 shadow-sm space-y-8 text-center">
                    <button onclick="exportData()" class="w-full py-5 bg-indigo-50 text-indigo-700 font-bold rounded-2xl flex items-center justify-center space-x-2"><i data-lucide="download" class="w-5 h-5"></i><span>දත්ත බැකප් (Backup)</span></button>
                    <button onclick="if(confirm('සියල්ල මකන්නද?')) { localStorage.removeItem(appId); location.reload(); }" class="w-full py-5 border-4 border-red-50 text-red-500 font-bold rounded-2xl hover:bg-red-50">දත්ත මකා දමන්න</button>
                </div>
            </div>`;
        }

        function exportData() {
            const s = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ user, habits, history: historyData }));
            const a = document.createElement('a'); a.href = s; a.download = "mindset_os_data.json"; a.click();
        }

        // --- Start ---
        init();
    </script>
</body>
</html>
